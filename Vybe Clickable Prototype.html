<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vybe Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--n:#10328F;--b:#5B88D6;--y:#F2C230;--ys:#FFF3C4;--l:#EEF3FF;--bd:#E3EAFA;--mu:#5B6896;--bg:#E7ECF8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1431}}
:root[data-theme="dark"]{--bg:#0D1431}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:Prompt,sans-serif;color:var(--n);display:flex;align-items:center;justify-content:center}
#app{width:390px;height:min(844px,100%);background:#fff;border-radius:36px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(16,50,143,.25)}
@media(max-width:500px){#app{width:100%;height:100%;border-radius:0}}
#scr{position:absolute;inset:0 0 76px;overflow-y:auto;padding-bottom:16px}
#scr.full{bottom:0}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
h1{margin:0}.p{padding:0 20px}.mu{color:var(--mu)}.row{display:flex;align-items:center;gap:10px}
.btn{height:50px;border-radius:25px;font-weight:700;font-size:15px;width:100%}
.y{background:var(--y);color:var(--n)}.nb{background:var(--n);color:#fff}.bb{background:var(--b);color:#fff}.lb{background:var(--l)}.gr{background:#EEF1F8}
.card{border:1.5px solid var(--bd);border-radius:20px;padding:10px}
.chip{flex:none;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;border:1.5px solid #B9C9EE}.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.tag{background:var(--ys);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.inp{height:48px;border:1.5px solid var(--bd);border-radius:12px;padding:0 14px;font:inherit;font-size:15px;color:var(--n);width:100%;box-sizing:border-box}
#nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1.5px solid var(--bd);display:flex;justify-content:space-around;align-items:center}
#nav.hide{display:none}
#nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;width:80px;color:var(--mu)}
#nav button.on{color:var(--n)}#nav button.on svg{stroke:var(--y)}
.sheet{position:absolute;inset:0;background:rgba(16,50,143,.45);display:flex;align-items:flex-end}
.sheet>div{background:#fff;border-radius:28px 28px 0 0;padding:20px;width:100%;box-sizing:border-box}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--bd);border-radius:16px;padding:12px 14px;margin-top:10px;width:100%;text-align:left}.opt.on{border-color:var(--b);background:var(--l)}
.rad{width:20px;height:20px;border-radius:10px;border:2px solid #B9C9EE;flex:none}.on .rad{border:6px solid var(--b)}
#toast{position:absolute;left:20px;right:20px;bottom:92px;background:var(--n);color:#fff;border-radius:16px;padding:12px 16px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}#toast.s{opacity:1}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style></head><body>
<div id="app"><div id="scr"></div><div id="nav"></div><div id="toast" role="status"></div></div>
<script>
/* ===== IMAGE SLOT MAP (every blank grey box = one image to drop in; each also has an HTML comment + data-slot id in the rendered DOM) =====
 home      up to 6 Upcoming Events cards (160px, cropped to 92px) + 3-4 Recommendation thumbnails (66px); content changes with the category chip
 discover  one 100px image per search result (search/category/filters change the list)
 event     #1 hero image, full width 390x300 (top of page)
 schedule  one thumbnail (56px) per activity in the day list
 community one attached-activity thumbnail (60px) per post | club logo/cover (56px) per club in the Clubs tab
 buddypost / postdetail  attached-activity thumbnail (64px / 60px)
 newpost   attached-activity thumbnail (64px)
 payment   activity thumbnail (64px)
 replan    #1-#2 suggested activity images (70px)
 profile   one 106px tile per past activity in Recap (each recap is a different activity; new ones are added when you finish an activity)
 recap     #1 activity photo (280px)
 sync      #1 illustration (170px)
 event     also: organizer club logo (48px) | club page: club logo/cover (72px) | route: map image (350x200) | recap: activity photo (280px)
 To use real images: replace the grey div inside ill() with <img src=... style="object-fit:cover"> keyed by slot id or event id. */
const st=(c,w=7)=>`stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
const tree=(x,y,r)=>`<rect x="${x-2}" y="${y}" width="5" height="${r+6}" fill="#8A5A3C"/><circle cx="${x}" cy="${y}" r="${r}" fill="#4FB286"/>`;
const sun=(x=96,y=22)=>`<circle cx="${x}" cy="${y}" r="11" fill="#F2C230"/><ellipse cx="30" cy="18" rx="14" ry="5" fill="#fff"/>`;
const N="#10328F",B="#5B88D6",G1="#9ADBB0";
let SN=0,CX='';
const ill=(k,w,r,lab)=>{SN++;const id=CX+' #'+SN,L=lab||k;return `<!-- IMAGE SLOT ${id}: ${L} | ${w}px wide -->`+`<div data-slot="${id}" role="img" aria-label="Image placeholder: ${L}" style="width:${w}px;height:${Math.round(w*110/120)}px;border-radius:${r==null?16:r}px;background:#E6EAF3;flex:none"></div>`};
const E={
run:{k:'run',t:'Lumpini Sunrise Run',w:'Sat 17 Oct · 06:00',p:'Free',loc:'Lumpini Park',org:'Bangkok Running Community',n:24,tag:'Beginner Friendly'},
climb:{k:'climb',t:'Climbing Session',w:'Sat 17 Oct · 13:00',p:'฿400',loc:'Climbing Gym A',org:'Climb Collective',n:5,tag:'Beginner Friendly'},
yoga:{k:'yoga',t:'Morning Yoga in the Park',w:'Sun 18 Oct · 07:00',p:'฿350',loc:'Benjakitti Park',org:'Park Yoga Club',n:6,tag:'All levels'},
ice:{k:'ice',t:'Ice Bath Recovery',w:'Sat 17 Oct · 16:00',p:'฿400',loc:'Recovery Studio',org:'Recovery Studio',n:10,tag:'Recovery'},
fun:{k:'run',t:'City Fun Run 5K',w:'Sat 24 Oct · 06:30',p:'฿350',loc:'Benjakitti Park',org:'Run Club Bangkok',n:45,tag:'Official partner'},
indoor:{k:'climb',t:'Indoor Climbing',w:'Sat 17 Oct · 08:00',p:'฿450',loc:'Climbing Gym A',org:'Climb Collective',n:5,tag:'Indoor · no dust'},
yin:{k:'yoga',t:'Indoor Yoga',w:'Sat 17 Oct · 08:00',p:'฿300',loc:'Studio K',org:'Studio K',n:8,tag:'Indoor · all levels'}};
const M={run:['4.8 (120)','2.1 กม.'],fun:['4.7 (86)','3.4 กม.'],climb:['4.6 (41)','4.0 กม.'],yoga:['4.5 (30)','2.8 กม.'],ice:['4.4 (22)','5.0 กม.']};
const S={cmp:[],rt:0,pj:{},chats:{},recaps:[{id:'r1',t:'Saturday Morning Run',pl:'Lumpini Park',dt:'10 Oct 2026',du:'1 hr 20 min',n:8,cl:'Bangkok Running Community'},{id:'r2',t:'Bouldering Night',pl:'Boulder Lab',dt:'8 Oct 2026',du:'1 hr 45 min',n:6,cl:'Climb Collective'},{id:'r3',t:'Sunset Yin Yoga',pl:'Studio K',dt:'3 Oct 2026',du:'1 hr',n:12,cl:'Studio K'},{id:'r4',t:'Sunday Sunrise Ride',pl:'Bang Kachao',dt:'27 Sep 2026',du:'2 hr 10 min',n:18,cl:'Bangkok Cycling Crew'},{id:'r5',t:'Ice Bath Recovery',pl:'Recovery Studio',dt:'20 Sep 2026',du:'45 min',n:5,cl:'Recovery Studio'},{id:'r6',t:'Reformer Pilates Intro',pl:'Studio Flow',dt:'13 Sep 2026',du:'50 min',n:7,cl:'Studio Flow'}],pid:10,cat:'All',q:'',fb:false,fs:false,fc:false,fav:[],ctab:'Feed',cq:'',ps:'',fol:{},posts:[{id:1,name:'Lisa',col:'#A8D8F0',time:'12 min ago',text:'อยากไปวิ่งแต่ไม่มีเพื่อน มีใครสนใจไปบ้าง',ev:'fun',type:'buddy',int:[]},{id:2,name:'Rose',col:'#FFB6D0',time:'1 hr ago',text:'หาเพื่อนไป Climbing ด้วยกัน #มือใหม่',ev:'boul',type:'buddy',int:[]},{id:3,name:'Mint',col:'#C9E8B8',time:'3 hr ago',text:'เพิ่งไปปั่นจักรยานมา บรรยากาศดีมาก',ev:'cyc',type:'share',int:[]},{id:4,name:'Jisoo',col:'#FFE680',time:'5 hr ago',text:'ใครอยากลอง Reformer Pilates ครั้งแรกบ้าง',ev:'pil',type:'buddy',int:[]}],att:null,pt:'',tg:{sc:true,al:true},stack:[],tab:'home',plan:[['run','Booked'],['climb','Booked'],['ice','Unpaid']],conn:{},alt:'indoor',how:'buddy'};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',schedule:'<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',community:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-5.5 6-5.5s6 2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c3 .3 5 2 5 5"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const LB={home:'Home',schedule:'My Schedule',community:'Community',profile:'Profile'};
const logo=s=>`<span style="font-family:'Playfair Display',serif;font-style:italic;font-size:${s}px;color:var(--y);font-weight:600">Vybe</span>`;
const back=`<button data-a="back" aria-label="Back" style="width:44px;height:44px;border-radius:22px;background:var(--l);font-size:22px;margin:24px 20px 0">‹</button>`;
const hdr=(s,t,r='')=>`<div class="p row" style="padding-top:26px;justify-content:space-between"><div><div style="font-size:13px;color:var(--b);font-weight:600">${s}</div><h1 style="font-size:28px;font-weight:800;line-height:1.15">${t}</h1></div>${r}</div>`;
const ev=(id,sm)=>{const e=E[id];return `<button data-go="event:${id}" class="card row" style="margin:8px 20px 0;width:calc(100% - 40px);text-align:left;gap:12px">${ill(e.k,66,18)}<span style="flex:1"><b style="font-size:15px;display:block">${e.t}</b><span class="mu" style="font-size:11px;display:block">${e.w} · ${e.loc}</span><span class="row" style="gap:6px;margin-top:4px"><b style="color:#2A4DA8">${e.p}</b><span class="tag">${e.tag}</span></span></span><span class="bb" style="padding:8px 14px;border-radius:17px;font-size:12px;font-weight:700">Join</span></button>`};

const CATS=['All','Running','Climbing','Yoga','Pilates','Cycling','Hiking','Swimming','Ice Bath'];
const mm=id=>M[id]||['4.5 (20)','3.0 กม.'];
Object.entries({run:'Running',climb:'Climbing',yoga:'Yoga',ice:'Ice Bath',fun:'Running',indoor:'Climbing',yin:'Yoga'}).forEach(([k,c])=>E[k].c=c);
const mk=(c,t,w,p,loc,org,n,tag)=>({k:'run',c,t,w,p,loc,org,n,tag});
Object.assign(E,{
pil:mk('Pilates','Reformer Pilates Intro','Sun 18 Oct · 09:00','฿500','Studio Flow','Studio Flow',8,'Beginner Friendly'),
pil2:mk('Pilates','Mat Pilates in the Park','Sat 24 Oct · 07:30','Free','Suan Rot Fai','Park Pilates Club',22,'All levels'),
cyc:mk('Cycling','Sunday Sunrise Ride','Sun 18 Oct · 05:30','Free','Bang Kachao','Bangkok Cycling Crew',31,'Beginner Friendly'),
cyc2:mk('Cycling','Night Ride Bangkok','Sat 24 Oct · 20:00','฿150','Rama VIII Bridge','Night Riders',18,'Intermediate'),
hike:mk('Hiking','Khao Yai Day Hike','Sat 24 Oct · 06:00','฿650','Khao Yai','Trail Buddies TH',14,'Beginner Friendly'),
hike2:mk('Hiking','Doi Suthep Sunrise Trek','Sun 25 Oct · 04:30','฿500','Chiang Mai','Trail Buddies TH',9,'Intermediate'),
swim:mk('Swimming','Open Water Swim Clinic','Sun 18 Oct · 08:00','฿350','Bangkok Aquatic Center','Swim Lab',12,'Beginner Friendly'),
swim2:mk('Swimming','Morning Lap Swim Club','Sat 17 Oct · 07:00','฿120','Lumpini Pool','Lap Club BKK',16,'All levels'),
boul:mk('Climbing','Bouldering Night','Sat 17 Oct · 19:00','฿350','Boulder Lab','Climb Collective',20,'Beginner Friendly'),
trail:mk('Running','Trail Run Workshop','Sun 18 Oct · 07:00','฿250','Suan Luang Rama IX','Bangkok Running Community',10,'Intermediate'),
yoga2:mk('Yoga','Sunset Yin Yoga','Fri 16 Oct · 18:00','฿300','Studio K','Studio K',15,'All levels'),
ice2:mk('Ice Bath','Ice Bath & Sauna Social','Sun 18 Oct · 17:00','฿450','Recovery Studio','Recovery Studio',12,'Recovery')});
Object.values(E).forEach(e=>{e.b=!/Intermediate/.test(e.tag);e.s=2;e.cl=/Club|Community|Collective|Crew|Riders|Buddies|Lab/.test(e.org)});
const LST=()=>Object.keys(E).filter(i=>i!='indoor'&&i!='yin');
const ok=id=>{const e=E[id];return(S.cat=='All'||e.c==S.cat)&&(!S.fb||e.b)&&(!S.fs||e.s>0)&&(!S.fc||e.cl)&&(!S.q||(e.t+e.loc+e.org+e.c).toLowerCase().includes(S.q.toLowerCase()))};
const catChips=()=>CATS.map(c=>`<button data-a="cat:${c}" class="chip ${S.cat==c?'on':''}">${c}</button>`).join('');
const dcard=id=>{const e=E[id],on=S.cmp.includes(id);return `<button data-go="event:${id}" class="card row" style="margin:10px 20px 0;width:calc(100% - 40px);text-align:left;gap:12px;align-items:stretch">${ill(e.k,100,16,'DISCOVERY › result card image · '+e.t)}<span style="flex:1"><b style="font-size:15px;display:block">${e.t}</b><span style="font-size:11px;font-weight:700;color:#2A4DA8;display:block">${e.org}</span><span class="mu" style="font-size:11px;display:block">${e.c} · ${e.loc} · ${mm(id)[1]}</span><span class="mu" style="font-size:11px;display:block">${e.w}</span><span class="row" style="justify-content:space-between;margin-top:6px"><b style="color:#2A4DA8">${e.p}</b><span data-a="cmp:${id}" style="border:1.5px solid var(--b);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:700;${on?'background:var(--l)':''}">${on?'✓':'+'} Compare</span></span></span></button>`};
const dlist=()=>{const f=LST().filter(ok);return `<div class="p row" style="margin-top:14px;justify-content:space-between"><span><b>${f.length} activities</b><br><span class="mu" style="font-size:11px">Oct 2026 · within 5 km</span></span><b style="font-size:12px;color:#2A4DA8">Sort: Best match</b></div>`+(f.length?f.map(dcard).join(''):'<div class="p mu" style="margin-top:24px;text-align:center">ไม่พบกิจกรรม ลองเปลี่ยนคำค้นหาหรือตัวกรอง</div>')+(S.cmp.length?`<div class="nb row" style="position:sticky;bottom:8px;margin:12px 16px 0;border-radius:24px;padding:8px 8px 8px 18px;justify-content:space-between"><span style="font-size:12px"><b>Compare</b><br>${S.cmp.length} selected · add up to 3</span><button data-go="compare" class="y" style="padding:10px 20px;border-radius:18px;font-weight:700">Compare</button></div>`:'')};
const plist=()=>{const f=LST().filter(i=>!S.ps||(E[i].t+E[i].c+E[i].loc).toLowerCase().includes(S.ps.toLowerCase())).slice(0,8);return f.map(i=>{const e=E[i];return `<button data-a="att:${i}" class="card row" style="margin:8px 20px 0;width:calc(100% - 40px);text-align:left;gap:10px;${S.att==i?'border-color:var(--b);background:var(--l)':''}">${ill(e.k,48,12,'CREATE POST › search result thumbnail')}<span style="flex:1"><b style="font-size:13px;display:block">${e.t}</b><span class="mu" style="font-size:11px">${e.c} · ${e.w} · ${e.p}</span></span><b>${S.att==i?'✓':''}</b></button>`}).join('')||'<div class="p mu" style="margin-top:12px">ไม่พบกิจกรรม</div>'};
const FR=[['เพื่อน A','#FF8FA3','Running · Yoga','run'],['เพื่อน B','#8FD3C7','Climbing · ย่านใกล้คุณ','boul'],['เพื่อน C','#FFE680','ไป Lumpini Sunrise Run เสาร์นี้','run'],['เพื่อน D','#8FA8E6','Cycling','cyc']];
const CL=[['Bangkok Running Community','Running','312'],['Climb Collective','Climbing','186'],['Park Yoga Club','Yoga','94'],['Studio Flow','Pilates','120'],['Bangkok Cycling Crew','Cycling','240'],['Trail Buddies TH','Hiking','158']];
const pc=p=>{const e=E[p.ev];return `<div style="margin:12px 20px 0;border:1.5px solid var(--bd);border-radius:22px;padding:12px"><div class="row"><span style="width:36px;height:36px;border-radius:18px;background:${p.col}"></span><div style="flex:1"><b>${p.name}</b><div class="mu" style="font-size:11px">${p.time}</div></div>${p.type=='buddy'?'<span class="tag">Looking for buddy</span>':''}</div><div style="margin:8px 0;font-size:14px">${p.text}</div><button data-go="event:${p.ev}" class="card row" style="width:100%;text-align:left;gap:10px">${ill(e.k,60,14,'COMMUNITY › attached activity thumbnail')}<span><b style="font-size:13px;display:block">${e.t}</b><span class="mu" style="font-size:11px">${e.w}</span><b style="display:block;color:#2A4DA8;font-size:13px">${e.p} · ดูกิจกรรม ›</b></span></button>`+(p.mine?`<button data-go="postdetail:${p.id}" class="btn lb" style="height:40px;margin-top:10px;font-size:13px">${p.int.length?p.int.length+' คนสนใจ · ดูผู้สนใจ ›':'รอเพื่อนตอบรับ...'}</button>`:`<div class="row" style="margin-top:10px">${S.pj[p.id]=='joined'?`<button data-go="chat:${p.ev}" class="nb" style="flex:1;height:38px;border-radius:19px;font-weight:700;font-size:12px">Joined ✓ Group chat</button>`:S.pj[p.id]=='pending'?`<button disabled class="lb" style="flex:1;height:38px;border-radius:19px;font-weight:700;font-size:13px;opacity:.7">Requested…</button>`:`<button data-a="pj:${p.id}" class="bb" style="flex:1;height:38px;border-radius:19px;font-weight:700;font-size:13px">Join</button>`}<button data-go="chat:dm~${p.name}~${p.ev}" class="y" style="flex:1;height:38px;border-radius:19px;font-weight:700;font-size:13px">Chat</button></div>`)+`</div>`};
const clist=()=>{const q=(S.cq||'').toLowerCase(),t=S.ctab;if(t=='Buddies')return FR.map((f,i)=>({f,i})).filter(o=>!q||(o.f[0]+o.f[2]).toLowerCase().includes(q)).map(o=>`<div class="row" style="margin:0 20px;padding:10px 0;border-bottom:1px solid #EEF1FA"><span style="width:40px;height:40px;border-radius:20px;background:${o.f[1]};flex:none"></span><button data-go="event:${o.f[3]}" style="flex:1;text-align:left"><b style="font-size:14px">${o.f[0]}</b><div class="mu" style="font-size:11px">${o.f[2]}</div></button><button data-a="conn:${o.i}" class="${S.conn[o.i]?'lb':'nb'}" style="width:92px;height:34px;border-radius:17px;font-size:12px;font-weight:700">${S.conn[o.i]?'Added':'Connect'}</button></div>`).join('')||'<div class="p mu" style="margin-top:20px">ไม่พบเพื่อน</div>';
if(t=='Clubs')return CL.filter(c=>!q||(c[0]+c[1]).toLowerCase().includes(q)).map(c=>`<div class="card row" style="margin:10px 20px 0;gap:12px"><button data-go="club:${c[0]}" class="row" style="flex:1;text-align:left;gap:12px">${ill('run',56,14,'COMMUNITY › club logo/cover')}<span><b style="font-size:14px;display:block">${c[0]}</b><span class="mu" style="font-size:11px">${c[1]} · ${c[2]} members</span></span></button><button data-a="fol:${c[0]}" class="${S.fol[c[0]]?'lb':'nb'}" style="width:84px;height:34px;border-radius:17px;font-size:12px;font-weight:700">${S.fol[c[0]]?'Following':'Follow'}</button></div>`).join('')||'<div class="p mu" style="margin-top:20px">ไม่พบ Club</div>';
return S.posts.filter(p=>(t!='Looking for buddy'||p.type=='buddy')&&(!q||(p.name+p.text+E[p.ev].t).toLowerCase().includes(q))).map(pc).join('')||'<div class="p mu" style="margin-top:20px">ยังไม่มีโพสต์ที่ตรงกัน</div>'};
const mkpost=ev=>{const id=++S.pid;S.posts.unshift({id,name:'Jennie Kim',col:'#FFE680',time:'just now',text:S.pt||'หาเพื่อนไปด้วยกัน',ev,type:'buddy',mine:true,int:[]});S.pt='';S.att=null;S.stack=[];S.tab='community';S.ctab='Feed';render();toast('โพสต์แล้ว');setTimeout(()=>{const p=S.posts.find(q=>q.id==id);if(p){p.int=[['เพื่อน A','#FF8FA3',false],['เพื่อน B','#8FD3C7',false]];toast('เพื่อน A และเพื่อน B สนใจโพสต์ของคุณ');render()}},2200)};

const TP=()=>(S.plan.find(p=>p[1]!='Done')||S.plan[0])[0];
const hhmm=()=>new Date().toTimeString().slice(0,5);

route:id=>{const e=E[id],t=e.w.match(/(\d\d):(\d\d)/),dep=t?(+t[1]*60+ +t[2]-DUR[S.rt]-10):0,hm=m=>String(Math.floor(((m%1440)+1440)%1440/60)).padStart(2,'0')+':'+String(((m%60)+60)%60).padStart(2,'0');return back+hdr('Route','เส้นทางไป '+e.loc)+`<div style="margin:14px 20px 0">${ill('run',350,22,'ROUTE › map image (replace with real map, 350x200)').replace('height:321px','height:200px')}</div><div class="card" style="margin:12px 20px 0"><div class="row"><span style="width:10px;height:10px;border-radius:5px;background:var(--b)"></span>ตำแหน่งของคุณ</div><div style="margin:4px 4px;border-left:2px dotted #B9C9EE;height:14px"></div><div class="row"><span style="width:10px;height:10px;border-radius:5px;background:var(--y)"></span><b>${e.loc}</b></div></div><div class="p row" style="margin-top:12px;overflow-x:auto">${MODES.map((m,i)=>`<button data-a="rt:${i}" class="chip ${S.rt==i?'on':''}" style="text-align:left;line-height:1.3">${m[0]}<br><span style="font-size:11px;font-weight:400">${m[1]} · ${m[2]}</span></button>`).join('')}</div><div class="lb" style="margin:12px 20px 0;border-radius:16px;padding:10px 14px;font-size:13px">${e.w}<br><b>ควรออกเดินทางภายใน ${hm(dep)}</b> เพื่อไปถึงก่อนเริ่ม 10 นาที<div class="mu" style="font-size:11px">เวลาเดินทางเป็นค่าประมาณตัวอย่าง</div></div><div style="margin:14px 20px 0"><a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(e.loc+' Bangkok')}" target="_blank" rel="noopener" class="btn y" style="display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box">เปิดใน Google Maps</a><button data-go="chat:${id}" class="btn lb" style="margin-top:10px">ส่งตำแหน่งนัดพบในแชทกลุ่ม</button></div>`},

postdetail:x=>{const p=S.posts.find(q=>q.id==x),e=E[p.ev],acc=p.int.filter(i=>i[2]).length;return back+hdr('Your post','โพสต์ของคุณ')+`<div class="p" style="margin-top:12px;font-size:16px">${p.text}</div><button data-go="event:${p.ev}" class="card row" style="margin:12px 20px 0;width:calc(100% - 40px);text-align:left;gap:10px">${ill(e.k,60,14,'POST DETAIL › attached activity thumbnail')}<span><b style="font-size:13px;display:block">${e.t}</b><span class="mu" style="font-size:11px">${e.w}</span><b style="display:block;color:#2A4DA8;font-size:13px">${e.p} · ดูกิจกรรม ›</b></span></button><div class="p" style="margin-top:16px;font-weight:800">${p.int.length} คนสนใจ</div>`+(p.int.length?p.int.map((q,j)=>`<div class="row" style="margin:0 20px;padding:10px 0;border-bottom:1px solid #EEF1FA"><span style="width:40px;height:40px;border-radius:20px;background:${q[1]};flex:none"></span><b style="flex:1">${q[0]}</b><button data-a="acc:${p.id}:${j}" class="${q[2]?'lb':'nb'}" style="width:96px;height:34px;border-radius:17px;font-size:12px;font-weight:700">${q[2]?'ตอบรับแล้ว':'Accept'}</button></div>`).join(''):'<div class="p mu" style="margin-top:8px;font-size:13px">ยังไม่มีคนสนใจ กลับมาดูอีกครั้งในอีกสักครู่</div>')+(acc?`<div style="margin:16px 20px 0"><button data-go="chat:${p.ev}" class="btn y">Group chat · ไปด้วยกัน ${acc+1} คน</button></div>`:'')},
saved:()=>back+hdr('Saved','กิจกรรมที่บันทึก')+(S.fav.length?S.fav.map(i=>ev(i)).join(''):'<div class="p mu" style="margin-top:20px">ยังไม่มีกิจกรรมที่บันทึก กดหัวใจในหน้ากิจกรรม</div>'),
club:p=>{const n=p||'Bangkok Running Community',ci=clubInfo(n),evs=LST().filter(i=>E[i].org==n);return back+`<div class="p row" style="gap:14px;margin-top:14px">${ill('run',72,36,'CLUB › logo / cover (72px)')}<div style="flex:1"><h1 style="font-size:22px;font-weight:800;line-height:1.15">${n}</h1><div class="mu" style="font-size:12px">${ci.cat} · ${ci.m} members</div></div></div><div class="p row" style="margin-top:14px"><button data-a="fol:${n}" class="btn ${S.fol[n]?'lb':'nb'}" style="height:42px;font-size:13px">${S.fol[n]?'Following':'Follow'}</button><button data-a="toast:ส่งข้อความถึงคลับแล้ว" class="btn lb" style="height:42px;font-size:13px">Message</button></div><div class="p" style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[[ci.m,'สมาชิก'],[evs.length,'กิจกรรม'],['★ 4.7','Rating']].map(x=>`<div class="lb" style="border-radius:16px;padding:12px"><b style="font-size:20px">${x[0]}</b><div style="font-size:11px">${x[1]}</div></div>`).join('')}</div><div class="p" style="margin-top:16px;font-weight:800">กิจกรรมของคลับ</div>`+(evs.length?evs.map(i=>ev(i)).join(''):'<div class="p mu" style="margin-top:8px">ยังไม่มีกิจกรรมที่เปิดรับ</div>')},
settings:()=>{const tg=(k,t)=>`<div class="row" style="margin:0 20px;padding:14px 0;border-bottom:1px solid #EEF1FA;justify-content:space-between"><span>${t}</span><button data-a="tg:${k}" role="switch" aria-checked="${S.tg[k]}" aria-label="${t}" style="width:46px;height:28px;border-radius:14px;position:relative;background:${S.tg[k]?'var(--b)':'#CBD3EA'}"><span style="position:absolute;top:3px;left:${S.tg[k]?21:3}px;width:22px;height:22px;border-radius:11px;background:#fff"></span></button></div>`;return back+hdr('Settings','ตั้งค่า')+`<div class="row" style="margin:14px 20px 0;padding:14px 0;border-bottom:1px solid #EEF1FA;justify-content:space-between"><span>เบอร์โทรศัพท์</span><b>+66 8X XXX XXXX</b></div>`+`<button data-go="saved" class="row" style="margin:0 20px;padding:14px 0;border-bottom:1px solid #EEF1FA;justify-content:space-between;width:calc(100% - 40px)"><span>กิจกรรมที่บันทึก (${S.fav.length})</span>›</button>`+tg('sc','ซิงก์รายชื่อติดต่อ')+tg('al','แจ้งเตือนฝุ่น PM2.5 / น้ำท่วม')+`<div style="margin:24px 20px 0"><button data-a="logout" class="btn gr">Log out</button></div>`},
};
const FULL=['signup','otp','sync','friends','event','notif','replan','recap','compare','payment','newpost','club','settings','route','chat','buddypost','postdetail','saved'];
function sheet(id){const e=E[id],o=[['solo','Join solo','ไปคนเดียว ดูคนที่มาแบบ Solo'],['buddy','Find a buddy','โพสต์หาเพื่อนให้ฟีด Community'],['friends','Join with friends','ชวนเพื่อนในแอปไปด้วยกัน']];
return `<div class="sheet" data-a="closesheet"><div data-stop><b style="font-size:18px">ต้องการเข้าร่วมแบบไหน?</b><div class="mu" style="font-size:12px">${e.t} · ${e.w}</div>${o.map(x=>`<button data-a="how:${x[0]}:${id}" class="opt ${S.how==x[0]?'on':''}"><span style="flex:1"><b style="font-size:14px">${x[1]}</b><span class="mu" style="display:block;font-size:11px">${x[2]}</span></span><span class="rad"></span></button>`).join('')}<button data-a="confirm:${id}" class="btn bb" style="margin-top:16px">Continue</button></div></div>`}
const $=s=>document.querySelector(s);
function render(){const cur=S.stack[S.stack.length-1]||{n:S.tab};const [n,p]=[cur.n,cur.p];const scr=$('#scr');
const sv=scr.scrollTop,same=render.l===n+p;render.l=n+p;SN=0;CX=n;scr.innerHTML=SC[n](p)+(cur.sheet?sheet(p):'');scr.classList.toggle('full',FULL.includes(n));scr.scrollTop=same?sv:0;if(n=='chat'){scr.scrollTop=scr.scrollHeight;if(same){const c=$('#cm');if(c)c.focus()}}
const nv=$('#nav');nv.classList.toggle('hide',FULL.includes(n));
nv.innerHTML=Object.keys(IC).map(k=>`<button data-tab="${k}" class="${S.tab==k?'on':''}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${LB[k]}</button>`).join('')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),1800)}
function go(s){const [n,p]=s.split(':');S.stack.push({n,p});render()}
document.addEventListener('click',e=>{
if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a],[data-go]'))return;
const t=e.target.closest('[data-tab],[data-go],[data-a]');if(!t)return;if($('#pt'))S.pt=$('#pt').value;
if(t.dataset.tab){S.tab=t.dataset.tab;S.stack=[];render();return}
if(t.dataset.go){go(t.dataset.go);return}
const [a,x,y]=t.dataset.a.split(':'),cur=S.stack[S.stack.length-1];
if(a=='back'){S.stack.pop();if(!S.stack.length&&!SC[S.tab])S.tab='home';render()}
else if(a=='toast')toast(t.dataset.a.slice(6));
else if(a=='conn'){S.conn[x]=!S.conn[x];render()}
else if(a=='join'){cur.sheet=true;render()}
else if(a=='closesheet'){if(e.target.classList.contains('sheet')){cur.sheet=false;render()}}
else if(a=='how'){S.how=x;render()}
else if(a=='confirm'){if(!S.plan.some(p=>p[0]==x))S.plan.push([x,E[x].p=='Free'?'Booked':'Unpaid']);const e=E[x];if(S.how=='buddy'){S.pt='หาเพื่อนไป '+e.t+' '+e.w.split(' ·')[0];S.att=x;S.stack=[{n:'buddypost',p:x}];render();toast('เพิ่มเข้าแผนแล้ว · โพสต์หาเพื่อนต่อได้เลย')}else{S.stack=[];S.tab='schedule';render();toast('เพิ่มเข้า My Schedule แล้ว')}}
else if(a=='pay'){go('payment:'+x)}
else if(a=='paid'){S.plan.find(q=>q[0]==x)[1]='Booked';S.stack=[];S.tab='schedule';render();toast('ชำระเงินแล้ว (จำลอง)')}
else if(a=='cmp'){const q=S.cmp.indexOf(x);if(q>-1)S.cmp.splice(q,1);else if(S.cmp.length<3)S.cmp.push(x);else toast('เลือกได้สูงสุด 3 รายการ');render()}
else if(a=='att'){S.att=x;render()}
else if(a=='post'){if(!S.att){toast('แนบกิจกรรมก่อนโพสต์');return}mkpost(S.att)}
else if(a=='mypost'){mkpost(x)}
else if(a=='cat'){S.cat=x;render()}
else if(a=='flt'){S[x]=!S[x];render()}
else if(a=='ctab'){S.ctab=x;render()}
else if(a=='fol'){S.fol[x]=!S.fol[x];render();toast(S.fol[x]?'ติดตาม '+x+' แล้ว':'เลิกติดตามแล้ว')}
else if(a=='fav'){const q=S.fav.indexOf(x);if(q>-1)S.fav.splice(q,1);else S.fav.push(x);render();toast(q>-1?'ลบออกจากที่บันทึกแล้ว':'บันทึกกิจกรรมแล้ว')}
else if(a=='acc'){const p=S.posts.find(q=>q.id==x);p.int[y][2]=true;render();toast(p.int[y][0]+' ถูกเพิ่มเข้า Group chat แล้ว')}
else if(a=='pj'){const p=S.posts.find(q=>q.id==x);S.pj[x]='pending';render();toast('ส่งคำขอไปที่ '+p.name+' แล้ว');setTimeout(()=>{S.pj[x]='joined';if(!S.plan.some(q=>q[0]==p.ev))S.plan.push([p.ev,E[p.ev].p=='Free'?'Booked':'Unpaid']);getChat(p.ev).push([p.name,'ยินดีต้อนรับนะ เจอกันที่งาน!',hhmm()]);render();toast(p.name+' ตอบรับแล้ว · เพิ่มเข้า My Schedule และ Group chat แล้ว')},2200)}
else if(a=='rt'){S.rt=+x;render()}
else if(a=='finish'){const e=E[x];let r=S.recaps.find(q=>q.id=='e'+x);if(!r){r={id:'e'+x,t:e.t,pl:e.loc,dt:'17 Oct 2026',du:'1 hr 20 min',n:e.n,cl:e.org};S.recaps.unshift(r)}const p=S.plan.find(q=>q[0]==x);if(p)p[1]='Done';S.stack=[{n:'recap',p:r.id}];render();toast('สร้าง Recap แล้ว · เพิ่มในโปรไฟล์')}
else if(a=='share'){const r=S.recaps.find(q=>q.id==x),txt=r.t+' @ '+r.pl+' · '+r.du+' with '+r.n+' people #Vybe';if(navigator.share)navigator.share({title:'Vybe Recap',text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกข้อความ Recap แล้ว'),()=>toast('แชร์ไม่ได้ในหน้านี้'));else toast('แชร์ไม่ได้ในหน้านี้')}
else if(a=='send'){const el=$('#cm'),v=el&&el.value.trim();if(!v)return;getChat(x).push(['คุณ',v,hhmm()]);render();setTimeout(()=>{const c=S.stack[S.stack.length-1];if(c&&c.n=='chat'&&c.p==x){const ans=['ได้เลย 👍','โอเค เจอกันนะ','ขอบคุณที่บอกนะ','ไปถึงแล้ว รอตรงทางเข้า'];getChat(x).push([(x.startsWith('dm~')?x.split('~')[1]:['เพื่อน A','Lisa','เพื่อน B'][Math.floor(Math.random()*3)]),ans[Math.floor(Math.random()*4)],hhmm()]);render()}},1400)}
else if(a=='tg'){S.tg[x]=!S.tg[x];render()}
else if(a=='publish'){S.stack.pop();render();toast('เผยแพร่ Event แล้ว (จำลอง)')}
else if(a=='logout'){S.stack=[{n:'signup'}];render()}
else if(a=='alt'){S.alt=x;render()}
else if(a=='usealt'){const i=S.plan.findIndex(p=>p[0]=='run');if(i>-1)S.plan[i]=[S.alt,E[S.alt].p=='Free'?'Booked':'Unpaid'];S.stack=[];S.tab='schedule';render();toast('เปลี่ยนเป็น' + E[S.alt].t + ' แล้ว · แจ้งเพื่อน 8 คนแล้ว')}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='dq'){S.q=t.value;$('#dl').innerHTML=dlist()}else if(t.id=='ps'){S.ps=t.value;$('#pl').innerHTML=plist()}else if(t.id=='cq'){S.cq=t.value;$('#cl').innerHTML=clist()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cm'){const b=document.querySelector('[data-a^="send:"]');if(b)b.click()}});
S.stack=[{n:'signup'}];render();
</script></body></html>
