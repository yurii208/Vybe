<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vybe Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root {
  --n: #10328f;
  --b: #5b88d6;
  --y: #ffd65b;
  --ys: #fff59d;
  --yt: #493a11; /* ตัวหนังสือบนพื้นเหลืองอ่อน (ป้าย ปุ่มรอง) */
  --l: #eef3ff;
  --bd: #e3eafa;
  --mu: #5b6896;
  --bg: #e7ecf8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1431;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1431;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  background: var(--bg);
  font-family: 'Manrope', 'Noto Sans Thai', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  color: var(--n);
  display: flex;
  align-items: center;
  justify-content: center;
}
#app {
  width: 390px;
  height: min(844px, 100%);
  background: #fff;
  border-radius: 36px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(16, 50, 143, 0.25);
}
@media (max-width: 500px) {
  #app {
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
}
#scr {
  position: absolute;
  inset: 0 0 76px;
  overflow-y: auto;
  padding-bottom: 16px;
}
#scr.full {
  bottom: 0;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: 0;
  color: inherit;
  background: none;
}
h1 {
  margin: 0;
}
h1, h2, h3 {
  font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', Arial, sans-serif;
  letter-spacing: -0.025em;
}
.btn, .chip, #nav button {
  font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', Arial, sans-serif;
}
.p {
  padding: 0 20px;
}
.mu {
  color: var(--mu);
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn {
  height: 50px;
  border-radius: 25px;
  font-weight: 700;
  font-size: 15px;
  width: 100%;
}
.y {
  background: var(--y);
  color: var(--n);
}
.nb {
  background: var(--b);
  color: #fff;
}
.bb {
  background: var(--b);
  color: #fff;
}
.lb {
  background: var(--l);
}
.gr {
  background: #eef1f8;
}
.card {
  border: 1.5px solid var(--bd);
  border-radius: 20px;
  padding: 10px;
}
.chip {
  flex: none;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  border: 1.5px solid #b9c9ee;
}
.chip.on {
  background: var(--b);
  color: #fff;
  border-color: var(--b);
}
.tag {
  background: var(--ys);
  color: var(--yt);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
}
.inp {
  height: 48px;
  border: 1.5px solid var(--bd);
  border-radius: 12px;
  padding: 0 14px;
  font: inherit;
  font-size: 15px;
  color: var(--n);
  width: 100%;
  box-sizing: border-box;
}
#nav {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 76px;
  background: #fff;
  border-top: 1.5px solid var(--bd);
  display: flex;
  justify-content: space-around;
  align-items: center;
}
#nav.hide {
  display: none;
}
#nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  width: 80px;
  color: var(--mu);
}
#nav button.on {
  color: var(--n);
}
#nav button.on svg {
  stroke: var(--y);
}
.sheet {
  position: absolute;
  inset: 0;
  background: rgba(16, 50, 143, 0.45);
  display: flex;
  align-items: flex-end;
}
.sheet > div {
  background: #fff;
  border-radius: 28px 28px 0 0;
  padding: 20px;
  width: 100%;
  box-sizing: border-box;
}
.opt {
  display: flex;
  gap: 12px;
  align-items: center;
  border: 1.5px solid var(--bd);
  border-radius: 16px;
  padding: 12px 14px;
  margin-top: 10px;
  width: 100%;
  text-align: left;
}
.opt.on {
  border-color: var(--b);
  background: var(--l);
}
.rad {
  box-sizing: border-box;
  width: 20px;
  height: 20px;
  border-radius: 10px;
  border: 2px solid #b9c9ee;
  flex: none;
}
.on .rad {
  border: 6px solid var(--b);
}
#toast {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 92px;
  background: var(--b);
  color: #fff;
  border-radius: 16px;
  padding: 12px 16px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  text-align: center;
}
#toast.s {
  opacity: 1;
}
/* ── ACTIVITY ROOM — พื้นที่แห่งการเชื่อมต่อ (ดูโค้ดส่วน 6b) */
.rm{position:absolute;inset:0;overflow:hidden;background:#06091f;color:#fff;font-family:'Noto Sans Thai','Manrope',Arial,sans-serif}
.rm-bg{position:absolute;left:-6%;top:-6%;width:112%;height:112%;object-fit:cover;filter:saturate(1.1) brightness(.85);animation:rmKen 28s ease-in-out infinite alternate}
.rm-in .rm-bg{animation:rmReveal 1.6s ease forwards,rmKen 28s ease-in-out 1.6s infinite alternate}
.rm-tint{position:absolute;inset:0}
.rm-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rm-glass{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22)}
.rm-top{position:absolute;left:16px;right:16px;top:18px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
.rm-ic{width:42px;height:42px;border-radius:21px;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.rm-seg{display:flex;border-radius:20px;padding:3px}
.rm-seg button{color:rgba(255,255,255,.85);font-size:12px;font-weight:700;padding:7px 12px;border-radius:16px}
.rm-seg button.on{background:#fff;color:#10328f}
.rm-head{position:absolute;left:22px;right:22px;top:78px;z-index:2}
.rm-meta{text-transform:uppercase;font-size:10.5px;letter-spacing:1.5px;font-weight:700;color:var(--rm-accent);font-family:'Manrope',sans-serif}
.rm-title{font-size:30px;line-height:1.08;margin-top:6px;color:#fff;font-weight:800;text-wrap:balance}
.rm-mood{font-size:15px;margin-top:8px;color:rgba(255,255,255,.9);line-height:1.5}
.rm-stage{position:absolute;left:0;right:0;top:206px;bottom:262px;z-index:2}
.rm-p{position:absolute;opacity:0;animation:rmIn 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.rm-bob{display:flex;align-items:center;gap:8px;animation:rmBob 7s ease-in-out infinite}
.rm-bob > img,.rm-bob > span{box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 18px var(--rm-accent)}
.rm-note{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:12px;max-width:150px;line-height:1.35}
.rm-note b{display:block;font-size:10px;color:var(--rm-accent);font-family:'Manrope',sans-serif}
.rm-panel{position:absolute;left:12px;right:12px;bottom:14px;border-radius:26px;padding:16px;z-index:3;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.rm-count{font-size:26px;font-weight:800;font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif}
.rm-sub{font-size:13px;color:rgba(255,255,255,.88)}
.rm-quick{display:flex;gap:6px;overflow-x:auto}
.rm-quick button{flex:none;color:#fff;font-size:12px;padding:7px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.4)}
.rm-row{display:flex;gap:8px}
.rm-btn{flex:1;height:46px;border-radius:16px;font-weight:700;font-size:14px;color:#fff;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.rm-btn-y{background:var(--y);color:var(--n)}
.rm-btn-done{background:rgba(255,255,255,.92);color:var(--n)}
.rm-mine{display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(255,214,91,.24);border-radius:12px;padding:6px 10px}
.rm-live{position:absolute;left:0;right:0;top:196px;bottom:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:2}
.rm-ring{position:relative;width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rm-ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--rm-accent) 0%,rgba(255,255,255,0) 70%);opacity:.55;animation:rmBreath 4s ease-in-out infinite}
.rm-ring-core{position:relative;width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rm-ring-core b{font-size:46px;line-height:1;font-family:'Plus Jakarta Sans',sans-serif}
.rm-ring-core span{font-size:12px;opacity:.88;margin-top:4px}
.rm-ripple{position:absolute;inset:24px;border-radius:50%;border:2px solid var(--rm-accent);animation:rmRipple 1.6s ease-out forwards}
.rm-ticker{font-size:14px;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 14px;max-width:82%;text-align:center}
.rm-ticker b{color:var(--rm-accent)}
.rm-wall{position:absolute;left:16px;right:16px;top:194px;bottom:206px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;z-index:2;align-content:start}
.rm-tile{margin:0;background:#fff;color:var(--n);border-radius:14px;padding:6px 6px 8px;transform:rotate(var(--r));opacity:0;animation:rmTile .9s ease forwards;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.rm-tile img,.rm-ph{width:100%;height:64px;object-fit:cover;border-radius:9px;display:block;background:#dde3f2}
.rm-tile figcaption{display:flex;gap:6px;align-items:center;font-size:11px;margin-top:6px;line-height:1.3}
.rm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.rm-stats b{display:block;font-size:19px;font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif}
.rm-stats span{font-size:11px;opacity:.88}
.rm-gate{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:rgba(6,10,36,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);text-align:center;padding:0 30px;width:100%}
.rm-gate-glow{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,var(--rm-accent),rgba(255,255,255,0) 70%);animation:rmBreath 3s ease-in-out infinite;margin-bottom:6px}
.rm-gate-k{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--rm-accent);font-family:'Manrope',sans-serif}
.rm-gate-t{font-size:28px;font-weight:800;line-height:1.1;font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif}
.rm-gate-s{font-size:15px;opacity:.92}
.rm-gate-h{display:flex;gap:6px;align-items:center;font-size:12px;opacity:.78;margin-top:18px}
.rm-enter{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:20px;background:rgba(6,10,36,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:13px;font-weight:700}
.rm-enter i{width:10px;height:10px;border-radius:5px;background:var(--y);box-shadow:0 0 10px var(--y);animation:rmBreath 2.4s ease-in-out infinite}
.rm-still .rm-p,.rm-still .rm-tile{animation:none;opacity:1}
.rm-pill{padding:9px 14px;border-radius:18px;font-size:12px;font-weight:700;color:#fff}
.rm-arrive{font-size:22px;font-weight:800;color:var(--rm-accent);font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif;animation:rmPop .9s cubic-bezier(.2,1.4,.4,1) both;transition:opacity 1.2s,transform 1.2s}
.rm-arrive.rm-fade{opacity:0;transform:translateY(-10px)}
.rm-calm .rm-ring::before{animation-duration:7s;opacity:.32}
.rm-calm .rm-ring-core{background:rgba(255,255,255,.08)}
@keyframes rmPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes rmKen{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-2%,-1.5%)}}
@keyframes rmReveal{from{transform:scale(1.18);filter:blur(10px) brightness(.6)}to{transform:scale(1);filter:saturate(1.1) brightness(.85)}}
@keyframes rmIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
@keyframes rmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rmBreath{0%,100%{transform:scale(.88);opacity:.5}50%{transform:scale(1.08);opacity:.85}}
@keyframes rmRipple{from{transform:scale(.7);opacity:.9}to{transform:scale(1.75);opacity:0}}
@keyframes rmTile{from{opacity:0;transform:rotate(var(--r)) translateY(20px)}to{opacity:1;transform:rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.rm *,.rm{animation:none!important}.rm-p,.rm-tile{opacity:1}}
/* ── ภาษา · ยืนยันตัวตน · Home ใหม่ */
.lang-tg{display:inline-flex;background:var(--l);border-radius:16px;padding:3px;gap:2px;flex:none}
.lang-tg button{height:28px;min-width:36px;border-radius:13px;font-size:12px;font-weight:800;color:var(--mu);letter-spacing:.3px}
.lang-tg button.on{background:#fff;color:var(--n);box-shadow:0 1px 4px rgba(16,50,143,.15)}
.vb{display:inline-flex;vertical-align:-2px;margin-left:3px;flex:none}
.from{font-size:10.5px;font-weight:700;color:var(--mu);background:#F1F4FA;border-radius:8px;padding:1px 7px}
.ugc-tr{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--b);margin-top:4px;padding:0}
.nv{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:var(--yt);background:var(--ys);border-radius:8px;padding:1px 7px;vertical-align:1px}
.card{box-shadow:0 6px 18px rgba(16,50,143,.06);border-color:#E8EEFA}
.tile{flex:none;width:172px;text-align:left;padding:6px 6px 10px;border-radius:22px}
.tile-img{height:100px;overflow:hidden;border-radius:17px;position:relative}
.tile-stk{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:14px;padding:2px 8px 2px 3px}
.stk{display:inline-flex}
.stk>span{border-radius:50%;box-shadow:0 0 0 2px #fff;overflow:hidden;display:inline-block}
.stk>span+span{margin-left:-7px}
.stk-n{font-size:10.5px;font-weight:800;color:var(--n)}
/* การ์ด "กรุงเทพฯ ตอนนี้" */
.pulse{position:relative;display:block;width:100%;height:206px;border-radius:26px;overflow:hidden;text-align:left;color:#fff;padding:16px 18px;box-sizing:border-box;background:radial-gradient(120% 90% at 85% 0%,#2f5fc4 0%,#163a9e 45%,#0d2470 100%);box-shadow:0 14px 30px rgba(16,50,143,.28)}
.pulse-map{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--y);box-shadow:0 0 10px rgba(255,214,91,.8)}
.spot::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(255,214,91,.8);animation:spot 2.6s ease-out infinite;animation-delay:inherit}
@keyframes spot{0%{transform:scale(1);opacity:.9}100%{transform:scale(5.5);opacity:0}}
.pulse>span{position:relative;display:flex}
.pulse-top{align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;opacity:.92}
.live{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 0 0 rgba(255,214,91,.7);animation:live 1.6s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(255,214,91,.7)}100%{box-shadow:0 0 0 9px rgba(255,214,91,0)}}
.pulse-big{align-items:baseline;gap:8px;margin-top:6px}
.pulse-big b{font-family:'Plus Jakarta Sans',sans-serif;font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.pulse-big span{font-size:13px;font-weight:600;opacity:.9;max-width:150px;line-height:1.25}
.pulse-tick{align-items:center;gap:9px;margin-top:12px;background:rgba(255,255,255,.13);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:7px 10px;max-width:66%}
.pulse-tick.in{animation:tick .5s ease}
@keyframes tick{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse-foot{position:absolute!important;left:18px;right:14px;bottom:12px;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;opacity:.95}
.pulse-go{background:var(--y);color:var(--n);font-weight:800;font-size:12px;border-radius:14px;padding:6px 12px}
.hm-av{border-radius:50%;box-shadow:0 0 0 3px var(--ys);flex:none;display:block;line-height:0}
/* เพื่อนกำลังจะไป */
.fg-row{margin-top:10px;overflow-x:auto;gap:12px;align-items:flex-start}
.fg{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.fg-ring{position:relative;padding:3px;border-radius:50%;background:conic-gradient(var(--y),var(--b),var(--y));line-height:0}
.fg-ring>img,.fg-ring>span:first-child{box-shadow:0 0 0 2.5px #fff;border-radius:50%}
.fg-vb{position:absolute;right:-2px;bottom:-1px;background:#fff;border-radius:50%;line-height:0;padding:1px}
.fg-vb .vb{margin:0}
.fg b{font-size:12.5px;margin-top:6px}
.fg span[data-ugc]{font-size:10.5px;color:var(--mu);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fg-day{font-size:10px;font-weight:800;color:var(--yt);background:var(--ys);border-radius:8px;padding:1px 6px;margin-top:3px}
.vnudge{display:flex;align-items:center;gap:12px;margin:14px 20px 0;width:calc(100% - 40px);border-radius:20px;padding:12px 14px;background:var(--l);border:1.5px solid #D6E1F8}
.vnudge-i{width:40px;height:40px;border-radius:14px;background:var(--b);display:flex;align-items:center;justify-content:center;flex:none}
/* ความปลอดภัย */
.safe{display:flex;align-items:center;gap:12px;background:#F3F6FD;border:1px solid #DCE5F8;border-radius:16px;padding:11px 12px;width:100%;box-sizing:border-box;text-align:left}
.safe b{display:block;font-size:13.5px}
.safe span span{display:block;font-size:12px;color:var(--mu);margin-top:1px;line-height:1.4}
.safe-i{width:36px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.dm-more{width:40px;height:40px;border-radius:20px;background:var(--l);font-size:20px;font-weight:800;flex:none}
.s-card{display:flex;gap:12px;margin:12px 20px 0;padding:14px;border-radius:18px;border:1.5px solid var(--bd)}
.s-card b{display:block;font-size:14.5px}
.s-card .mu{display:block;font-size:12.5px;margin-top:3px;line-height:1.5}
.s-i{width:40px;height:40px;border-radius:14px;background:var(--l);display:flex;align-items:center;justify-content:center;flex:none}
.s-sos{margin:16px 20px 0;padding:14px;border-radius:18px;background:var(--ys);color:var(--yt)}
.s-num{flex:1;background:#fff;border-radius:14px;padding:8px;text-align:center;text-decoration:none;color:var(--n)}
.s-num b{display:block;font-size:18px}
.s-num span{font-size:10.5px;color:var(--mu);font-weight:600}
#ovl{z-index:40;animation:fadein .2s}
#ovl>div{animation:sheetup .25s ease}
@keyframes fadein{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(40px)}}
/* หน้ายืนยันตัวตน */

const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const toDate = (d) => {
  const [y, m, dd] = d.split('-').map(Number);
  return new Date(y, m - 1, dd);
};
const fmtDay = (d) => {
  const x = toDate(d);
  return DAYS[x.getDay()] + ' ' + x.getDate() + ' ' + MONTHS[x.getMonth()];
};
const fmtDate = (d) => {
  const x = toDate(d);
  return x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + x.getFullYear();
};
const fmtMins = (m) => {
  m = Math.max(1, Math.round(m));
  const h = Math.floor(m / 60),
    r = m % 60;
  return (h ? h + ' hr' : '') + (h && r ? ' ' : '') + (r ? r + ' min' : '');
};
const money = (n) => (n ? '฿' + n.toLocaleString('en-US') : 'Free');

const CLUB = Object.fromEntries(CLUBS.map((c) => [c.id, c]));

// A[id] = กิจกรรมพร้อมค่าที่ใช้แสดงผล
const A = {};
ACTIVITIES.forEach((a) => {
  const c = CLUB[a.club] || { name: a.club, type: 'club' };
  A[a.id] = Object.assign({}, a, {
    clubName: c.name,
    day: fmtDay(a.date),
    when: fmtDay(a.date) + ' · ' + a.time,
    priceLabel: money(a.price),
    duration: fmtMins(a.mins),
    tag: a.badge || a.level + (a.indoor ? ' · Indoor' : ''),
    beginner: a.level == 'Beginner' || a.level == 'All levels',
    byClub: c.type == 'club',
    kmLabel: a.km + ' km',
    ratingLabel: a.rating.toFixed(1) + ' (' + a.reviews + ')',
  });
});

const sortKey = (a) => a.date + ' ' + a.time;
// กิจกรรมที่ยังมาไม่ถึง เรียงตามวันเวลา
const UPCOMING = Object.values(A)
  .filter((a) => a.date >= TODAY)
  .sort((x, y) => (sortKey(x) < sortKey(y) ? -1 : 1))
  .map((a) => a.id);

const clubActivities = (clubId) => UPCOMING.filter((i) => A[i].club == clubId);
const clubByName = (n) => CLUBS.find((c) => c.name == n || c.id == n) || CLUBS[0];

// แผนใหม่ที่แนะนำ: กิจกรรมในร่ม วันเดียวกัน ยังไม่อยู่ในแผน เรียงตามเวลาที่ใกล้เคียงที่สุด
const toMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const indoorAlternatives = (id, n = 3) => {
  const a = A[id];
  return Object.values(A)
    .filter((x) => x.indoor && x.date == a.date && x.id != id && !S.plan.some((p) => p.id == x.id))
    .sort((x, y) => Math.abs(toMin(x.time) - toMin(a.time)) - Math.abs(toMin(y.time) - toMin(a.time)))
    .slice(0, n)
    .map((x) => x.id);
};

const hasPrefs = () => {
  const P = S.prefs;
  return !!(P.cats.length || P.level || P.time.length || P.budget || P.style);
};
// loose = โหมดผ่อนเกณฑ์ (ไม่ตัดเรื่องงบ/ระดับ) ใช้เติมเมื่อกิจกรรมที่ตรงทุกข้อมีน้อย
const prefScore = (a, loose) => {
  const P = S.prefs,
    why = [];
  let s = a.rating / 10;
  if (P.cats.length) {
    if (P.cats.includes(a.cat)) (s += 3), why.push(a.cat);
    else s -= 2;
  }
  if (P.level == 'new') a.beginner ? ((s += 1), why.push('Beginner friendly')) : loose ? 0 : (s -= 1.5);
  if (P.level == 'regular' && /Intermediate|Advanced/.test(a.level)) (s += 1), why.push(a.level);
  if (P.time.length) {
    const h = +a.time.slice(0, 2),
      d = toDate(a.date).getDay(),
      slot = [h < 10 && 'morning', h >= 17 && 'evening', (d == 0 || d == 6) && 'weekend'].filter(Boolean),
      hit = P.time.find((t) => slot.includes(t));
    if (hit) (s += 1), why.push({ morning: 'Morning', evening: 'Evening', weekend: 'Weekend' }[hit]);
  }
  if (P.budget && P.budget != 'any') {
    if (a.price <= +P.budget) (s += 1), why.push(a.price ? 'Under ฿' + P.budget : 'Free');
    else if (loose) (s -= (a.price - +P.budget) / 2000), why.push(a.priceLabel); // เกินงบน้อยกว่าขึ้นก่อน
    else s -= 3;
  }
  if (P.style == 'solo' && a.solo >= 3) (s += 0.5), why.push('Solo-friendly');
  if (P.style == 'meet' && a.byClub) (s += 0.5), why.push('Social club');
  if (P.style == 'friends' && FRIENDS.some((f) => f.going == a.id)) (s += 1), why.push('Friends going');
  return { s, why: why.slice(0, 3) };
};
const prefSummary = () => {
  const P = S.prefs,
    lab = (k, v) => ((QUIZ.find((q) => q.key == k).options.find((o) => o[0] == v) || [])[1] || '');

const resetPay = (qty = 1) => {
  S.pay = {
    method: S.savedCard ? 'card' : 'promptpay',
    useSaved: !!S.savedCard,
    qty,
    promo: '',
    promoOk: null,
    card: { num: '', exp: '', cvc: '', name: '' },
    save: true,
    err: '',
  };
};
const quote = (id) => {
  const a = A[id],
    q = S.pay.qty,
    sub = a.price * q,
    fee = a.price ? SERVICE_FEE * q : 0,
    p = S.pay.promoOk && PROMOS[S.pay.promoOk],
    discount = p ? (p.pct ? Math.round((sub * p.pct) / 100) : Math.min(p.off, sub)) : 0;
  return { qty: q, sub, fee, discount, total: sub + fee - discount };
};
const methodName = () => {
  if (S.pay.method == 'card') {
    if (S.pay.useSaved && S.savedCard) return S.savedCard.brand + ' •••• ' + S.savedCard.last4;
    const n = S.pay.card.num.replace(/\D/g, '');
    if (n.length == 16) return cardBrand(n) + ' •••• ' + n.slice(-4);
  }
  return PAY_METHODS.find((m) => m.id == S.pay.method).name;
};
const cardBrand = (n) => (/^4/.test(n) ? 'Visa' : /^5/.test(n) ? 'Mastercard' : /^35/.test(n) ? 'JCB' : 'Card');
const cardError = () => {
  const c = S.pay.card,
    n = c.num.replace(/\D/g, ''),
    m = c.exp.match(/^(\d\d)\/(\d\d)$/);
  if (n.length != 16) return 'Enter the 16-digit card number.';
  if (!m || +m[1] < 1 || +m[1] > 12) return 'Enter the expiry date as MM/YY.';
  if (+m[2] < 26 || (+m[2] == 26 && +m[1] < 10)) return 'This card has expired. Use another card.';
  if (!/^\d{3,4}$/.test(c.cvc)) return 'Enter the 3-digit security code on the back of the card.';
  if (!c.name.trim()) return 'Enter the name on the card.';
  return '';
};
const startProcessing = (id, declined) => {
  S.stack.push({ n: 'processing', p: id });
  render();
  setTimeout(() => {
    if (declined) {
      S.stack.pop();
      S.pay.err = 'Your card was declined. Try another card or another payment method.';
      render();
      return;
    }
    completePayment(id);
  }, 1600);
};
const completePayment = (id) => {
  const q = quote(id),
    ref = newRef(),
    now = new Date();
  addToPlan(id);
  Object.assign(planItem(id), { status: 'Booked', ref, qty: q.qty });
  if (S.pay.method == 'card' && !S.pay.useSaved && S.pay.save) {
    const n = S.pay.card.num.replace(/\D/g, '');
    S.savedCard = { brand: cardBrand(n), last4: n.slice(-4) };
  }
  S.payments.unshift({ ref, act: id, ...q, method: methodName(), at: fmtDate(TODAY) + ' · ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) });
  S.lastRef = ref;
  S.stack = [{ n: 'receipt', p: ref }];
  S.tab = 'schedule';
  render();
};

// สีบรรยากาศตามเวลาของกิจกรรม: [แสงด้านบน, เงาด้านล่าง, สีเน้น]
const ROOM_TONES = {
  dawn: ['rgba(255,190,110,.42)', 'rgba(14,22,66,.92)', '#FFD65B'],
  day: ['rgba(255,236,190,.28)', 'rgba(10,32,78,.9)', '#FFE9A6'],
  dusk: ['rgba(255,125,110,.42)', 'rgba(44,12,70,.92)', '#FFB38A'],
  night: ['rgba(80,100,210,.38)', 'rgba(6,10,36,.95)', '#A9BEFF'],
};

S.room = { phase: {}, notes: {}, live: {}, here: {}, rank: {}, arriving: {}, seen: {}, muted: false, open: false };

const roomTone = (a) => {
  const h = +a.time.slice(0, 2);
  return h < 10 ? 'dawn' : h < 16 ? 'day' : h < 19 ? 'dusk' : 'night';
};
const roomKind = (a) => (['Swimming', 'Paddle', 'Ice Bath'].includes(a.cat) ? 'water' : a.indoor ? 'studio' : 'nature');
const nowOnToday = () => {
  const d = toDate(TODAY),
    n = new Date();
  d.setHours(n.getHours(), n.getMinutes());
  return d;
};
const actStart = (a) => {
  const d = toDate(a.date);
  d.setHours(+a.time.slice(0, 2), +a.time.slice(3, 5));
  return d;
};
// ช่วงของห้องตามการไปจริง: จบแล้ว → after · เช็คอินแล้ว → live · นอกนั้น → before
const roomAutoPhase = (id) => {
  const pi = planItem(id);
  if (pi && pi.status == 'Done') return 'after';
  return S.room.here[id] ? 'live' : 'before';
};
const roomPhase = (id) => (S.toggles.demo && S.room.phase[id]) || roomAutoPhase(id);
const roomOpensAt = (id) => new Date(actStart(A[id]).getTime() - ROOM.opensHours * 3600000);
// เข้าห้องได้เมื่อ: จอง (จ่าย) แล้ว และถึงเวลาเปิดห้อง หรือกิจกรรมจบแล้ว
const roomAvailable = (id) => {
  const pi = planItem(id);
  return !!pi && pi.status != 'Unpaid' && (pi.status == 'Done' || S.room.here[id] || nowOnToday() >= roomOpensAt(id));
};
const roomOpensLabel = (id) => {
  const d = roomOpensAt(id);
  return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' · ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
};
const roomCountdown = (id) => {
  const ms = actStart(A[id]) - nowOnToday();
  if (ms <= 0) return 'See you at ' + A[id].time;
  const m = Math.round(ms / 60000),
    d = Math.floor(m / 1440),
    h = Math.floor((m % 1440) / 60);
  return 'Starts in ' + (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + (d ? '' : (m % 60) + 'm');
};
// คนในห้อง: เพื่อนที่ไป → คนที่โพสต์ถึงกิจกรรมนี้ → คนทั่วไป (สูงสุด 6 คน)
const roomPeople = (id, notes) => {
  const seen = new Set(),
    out = [],
    add = (name, color) => !seen.has(name) && name != USER.name && seen.add(name) && out.push({ name, color });
  FRIENDS.filter((f) => f.going == id).forEach((f) => add(f.name, f.color));
  S.posts.filter((p) => p.act == id && !p.mine).forEach((p) => add(p.name, p.color));
  ROOM.crowd.forEach((c) => add(c[0], c[1]));
  const k = ACTIVITIES.findIndex((x) => x.id == id);
  return out.slice(0, 6).map((p, i) => ({ ...p, note: roomOwnNote(p.name, notes) || notes[(k + i) % notes.length] }));
};
const buzz = (p) => {
  try {
    if (navigator.vibrate) navigator.vibrate(p);
  } catch (e) {}
};
const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};

// ── เสียงบรรยากาศ (สังเคราะห์ด้วย Web Audio) — เริ่มได้หลังผู้ใช้แตะเท่านั้น (กฎของเบราว์เซอร์)
const RoomAudio = {
  ctx: null,
  master: null,
  live: [],
  timers: [],
  sig: '',
  ensure() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state == 'suspended') this.ctx.resume();
      return true;
    } catch (e) {
      return false;
    }
  },
  vol: 0.6,
  applyMute() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(S.room.muted ? 0 : this.vol, t, 0.8);
  },
  level(v) {
    this.vol = v;
    this.applyMute();
  },
  stopLayers() {
    this.timers.forEach(clearInterval);
    this.timers = [];
    this.live.forEach((n) => {
      try {
        n.stop();
      } catch (e) {}
    });
    this.live = [];
    this.sig = '';
  },
  stop() {
    if (!this.ctx) return;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setValueAtTime(0, this.ctx.currentTime);
    this.stopLayers();
  },
  osc(type, f, g, dest) {
    const o = this.ctx.createOscillator(),
      gn = this.ctx.createGain();
    o.type = type;
    o.frequency.value = f;
    gn.gain.value = g;
    o.connect(gn).connect(dest);
    o.start();
    this.live.push(o);
  },
  // คอร์ดนุ่ม ๆ ที่ "หายใจ" ช้า ๆ
  pad(freqs, level, cutoff) {
    const c = this.ctx,
      f = c.createBiquadFilter(),
      g = c.createGain(),
      lfo = c.createOscillator(),
      lg = c.createGain();
    f.type = 'lowpass';
    f.frequency.value = cutoff;
    g.gain.value = level;
    f.connect(g).connect(this.master);
    lfo.frequency.value = 0.07;
    lg.gain.value = level * 0.45;
    lfo.connect(lg).connect(g.gain);
    lfo.start();
    this.live.push(lfo);
    freqs.forEach((fr) => {
      this.osc('sine', fr, 0.16, f);
      this.osc('triangle', fr * 1.004, 0.05, f);
    });
  },
  // เสียงลม / น้ำ / ห้อง (noise ผ่านฟิลเตอร์ + คลื่นช้า ๆ)
  noise(cutoff, level, rate) {
    const c = this.ctx,
      len = c.sampleRate * 2,
      buf = c.createBuffer(1, len, c.sampleRate),
      d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = last * 3.5;
    }
    const src = c.createBufferSource(),
      f = c.createBiquadFilter(),
      g = c.createGain(),
      lfo = c.createOscillator(),
      lg = c.createGain();
    src.buffer = buf;
    src.loop = true;
    f.type = 'lowpass';
    f.frequency.value = cutoff;
    g.gain.value = level;
    lfo.frequency.value = rate;
    lg.gain.value = level * 0.6;
    lfo.connect(lg).connect(g.gain);
    src.connect(f).connect(g).connect(this.master);
    src.start();
    lfo.start();
    this.live.push(src, lfo);
  },
  blip(freq, dur, level, slide) {
    const c = this.ctx,
      t = c.currentTime,
      o = c.createOscillator(),
      g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur * 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.05);
  },
  birds() {
    this.timers.push(
      setInterval(() => {
        if (Math.random() < 0.55) {
          const base = 2300 + Math.random() * 1700,
            n = 1 + Math.floor(Math.random() * 3);
          for (let k = 0; k < n; k++) setTimeout(() => this.ctx && this.blip(base, 0.12, 0.035, 1.45), k * 150);
        }
      }, 1700),
    );
  },
  pulse(bpm) {
    this.timers.push(
      setInterval(() => {
        const c = this.ctx,
          t = c.currentTime,
          o = c.createOscillator(),
          g = c.createGain();
        o.frequency.setValueAtTime(95, t);
        o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
        g.gain.setValueAtTime(0.32, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g).connect(this.master);
        o.start(t);
        o.stop(t + 0.25);
      }, 60000 / bpm),
    );
  },
  bells(freqs) {
    this.timers.push(setInterval(() => this.blip(freqs[Math.floor(Math.random() * freqs.length)] * 2, 2.4, 0.045), 3200));
  },
  chime() {
    if (this.ctx && this.live.length && !S.room.muted) this.blip(1318.5, 1.2, 0.05);
  },
  play(a, phase) {
    const kind = roomKind(a),
      tone = roomTone(a),
      sig = a.id + phase;
    if (this.sig == sig && this.live.length) return this.applyMute();
    this.stopLayers();
    if (!this.ensure()) return;
    this.sig = sig;
    this.vol = phase == 'live' && !S.room.arriving[a.id] ? 0.32 : 0.6;
    const amb = { nature: [750, 0.05, 0.12], water: [420, 0.09, 0.16], studio: [300, 0.025, 0.05] }[kind];
    const fast = ['Running', 'Cycling', 'Dance', 'Muay Thai', 'Padel', 'Climbing'].includes(a.cat);
    if (phase == 'after') {
      this.pad([293.66, 369.99, 440, 587.33], 0.5, 1400);
      this.noise(amb[0], amb[1] * 0.6, amb[2]);
      this.bells([293.66, 369.99, 440]);
    } else {
      this.pad([220, 277.18, 329.63, 415.3], phase == 'live' ? 0.42 : 0.5, phase == 'live' ? 1900 : 1100);
      this.noise(amb[0], amb[1], amb[2]);
      if (kind == 'nature' && tone != 'night') this.birds();
      if (phase == 'live') this.pulse(fast ? 112 : 64);
    }
    this.applyMute();
  },
};

// ── อนุภาคแสง (ฝุ่นแสงลอยขึ้น / ฟองน้ำสำหรับกิจกรรมทางน้ำ)
let roomStopFx = null,
  roomTimers = [],
  roomMounted = false;
const roomParticles = (cv, a, phase) => {
  const ctx = cv.getContext('2d'),
    dpr = window.devicePixelRatio || 1,
    W = cv.clientWidth,
    H = cv.clientHeight,
    kind = roomKind(a),
    col = ROOM_TONES[roomTone(a)][2],
    still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches,
    speed = phase == 'live' ? 1.9 : 1,
    ps = Array.from({ length: phase == 'live' ? 70 : 46 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: kind == 'water' ? 2 + Math.random() * 5 : 0.8 + Math.random() * 2.2,
      v: (0.15 + Math.random() * 0.5) * speed,
      t: Math.random() * 6.3,
    }));
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.scale(dpr, dpr);
  let raf = 0;
  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      if (!still) {
        p.y -= p.v;
        p.t += 0.02;
        p.x += Math.sin(p.t) * 0.3;
        if (p.y < -10) (p.y = H + 10), (p.x = Math.random() * W);
      }
      const tw = 0.3 + 0.35 * (1 + Math.sin(p.t * 2)) * 0.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.3);
      if (kind == 'water') {
        ctx.strokeStyle = `rgba(255,255,255,${tw})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        ctx.shadowBlur = 8;
        ctx.shadowColor = col;
        ctx.fillStyle = hexA(col, tw + 0.2);
        ctx.fill();
      }
    }
    if (!still) raf = requestAnimationFrame(draw);
  };
  draw();
  return () => cancelAnimationFrame(raf);
};

function roomMount(id) {
  const a = A[id],
    phase = roomPhase(id);
  if (roomStopFx) roomStopFx();
  roomTimers.forEach((t) => (clearInterval(t), clearTimeout(t)));
  roomTimers = [];
  roomMounted = true;
  const cv = $('#rmCanvas');
  if (cv) roomStopFx = roomParticles(cv, a, phase);
  if (!S.room.open) return;
  RoomAudio.play(a, phase);
  if (phase == 'before')
    roomTimers.push(
      setInterval(() => {
        const el = $('#rmCd');
        if (el) el.textContent = roomCountdown(id);
      }, 30000),
    );
  if (phase == 'live' && S.room.arriving[id]) {
    // พิธีมาถึง: คลื่นแสง 3 ระลอก + เสียงกริ๊ง แล้วค่อย ๆ สงบลงใน 5 วินาที
    [0, 450, 900].forEach((t) =>
      setTimeout(() => {
        const ring = $('#rmRing');
        if (!ring) return;
        const r = document.createElement('i');
        r.className = 'rm-ripple';
        ring.appendChild(r);
        setTimeout(() => r.remove(), 1700);
        RoomAudio.chime();
      }, t),
    );
    const calm = setTimeout(() => {
      S.room.arriving[id] = false;
      const root = $('.rm'),
        ar = $('#rmArrive'),
        sub = $('#rmLiveSub');
      if (root) root.classList.add('rm-calm');
      if (ar) ar.classList.add('rm-fade');
      if (sub) sub.textContent = 'วางมือถือแล้วสนุกกับช่วงเวลานี้ได้เลย · ทุกการเช็คอินคือเสียงหัวใจของห้องนี้';
      RoomAudio.level(0.32);
    }, 5000);
    roomTimers.push(calm);
  }
  if (phase == 'live')
    roomTimers.push(
      setInterval(() => {
        let n = S.room.live[id] ?? Math.round(a.going * 0.6);
        if (n >= a.going + (S.room.here[id] ? 1 : 0)) return;
        S.room.live[id] = ++n;
        const c = $('#rmCount'),
          tk = $('#rmTicker'),
          ring = $('#rmRing');
        if (!c) return;
        c.textContent = n;
        const who = roomPeople(id, ROOM.liveTicker)[n % 6];
        if (tk && who) tk.innerHTML = `<b>${who.name}</b> ${tx('checked in', 'เช็คอินแล้ว')} · <span data-ugc>${who.note}</span>`;
        if (ring) {
          const r = document.createElement('i');
          r.className = 'rm-ripple';
          ring.appendChild(r);
          setTimeout(() => r.remove(), 1700);
        }
        RoomAudio.chime();
      }, 2600),
    );
}
function roomUnmount() {
  if (!roomMounted) return;

  roomStopFx = null;
  roomTimers.forEach(clearInterval);
  roomTimers = [];
  RoomAudio.stop();

}

const TR_CACHE = { th: new Map(), en: new Map() };
const DATE_RE = /\b(Sun|Mon|Tue|Wed|Thu|Fri|Sat)(,?) (\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)( \d{4})?\b/g;
const DATE2_RE = /\b(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)( \d{4})?\b/g;
function T(t, lang = LANG.cur) {
  const d = I18N[lang];
  if (Object.prototype.hasOwnProperty.call(d, t)) return d[t];
  const C = TR_CACHE[lang];
  if (C.has(t)) return C.get(t);
  let w = t, r = t;
  if (lang == 'th') w = t.replace(DATE_RE, (_, d, c, n, m, y) => `${TH_DAY[d]} ${n} ${TH_MON[m]}${y ? ' ' + BE(y) : ''}`).replace(DATE2_RE, (_, n, m, y) => `${n} ${TH_MON[m]}${y ? ' ' + BE(y) : ''}`);
  if (w != t && Object.prototype.hasOwnProperty.call(d, w)) r = d[w];
  else {
    for (const [re, f] of I18N_RE[lang]) {
      const m = w.match(re);
      if (m) {
        r = f(m);
        break;
      }
    }
    if (r == t) r = w;
  }
  if (r == t && t.includes(' · ')) r = t.split(' · ').map((s) => T(s, lang)).join(' · ');
  C.set(t, r);
  return r;
}

// แปลทุกข้อความในส่วนที่เพิ่งวาด (ข้าม data-ugc = ข้อความที่คนเขียน)
const TR_ATTRS = ['placeholder', 'aria-label', 'title'];
function translateNode(root) {
  const lang = LANG.cur;
  if (!root) return;
  if (root.nodeType == 3) return trTextNode(root, lang);
  if (root.nodeType != 1 || root.closest('[data-ugc],script,style')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: (n) => (n.nodeType == 1 && (n.hasAttribute('data-ugc') || n.tagName == 'SCRIPT' || n.tagName == 'STYLE') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
  });
  let n = root;
  do {
    if (n.nodeType == 3) trTextNode(n, lang);
    else for (const k of TR_ATTRS) if (n.hasAttribute(k)) {
      const v = n.getAttribute(k), r = T(v.trim(), lang);
      if (r != v.trim()) n.setAttribute(k, r);
    }
  } while ((n = w.nextNode()));
}
function trTextNode(n, lang) {
  const v = n.nodeValue, t = v.trim();
  if (!t || (n.parentElement && n.parentElement.closest('[data-ugc]'))) return;
  const r = T(t, lang);
  if (r != t) n.nodeValue = v.replace(t, r);
}
const I18N_OBS = new MutationObserver((ms) => {
  for (const m of ms) {
    if (m.type == 'characterData') trTextNode(m.target, LANG.cur);
    else m.addedNodes.forEach(translateNode);
  }
});
function setLang(l) {
  LANG.cur = l;
  lsSet('vybe.lang', l);

}

function drawOverlay() {
  const old = $('#ovl');
  if (old) old.remove();
  if (!S.dmMenu) return;
  const name = S.dmMenu.split('~')[1],
    rep = S.dmReport;
  const html = rep
    ? `<b style="font-size:17px">${tx('Why are you reporting ' + name + '?', 'รายงาน ' + name + ' เพราะอะไร?')}</b><div class="mu" style="font-size:12px;margin-top:4px">${tx('They won’t know who reported them.', 'อีกฝ่ายจะไม่รู้ว่าใครเป็นคนรายงาน')}</div>${[
        tx('Fake profile or not who they say', 'โปรไฟล์ปลอม หรือไม่ใช่คนที่อ้าง'),
        tx('Harassment or made me uncomfortable', 'คุกคาม หรือทำให้รู้สึกไม่สบายใจ'),
        tx('Asked to meet somewhere private', 'ชวนไปเจอในที่ส่วนตัว'),
        tx('Spam, scam or asking for money', 'สแปม หลอกลวง หรือขอเงิน'),
        tx('Something else', 'อื่น ๆ'),
      ]
        .map((r, i) => `<button data-a="dmrep:${i}" class="opt" style="margin-top:8px">${r}</button>`)
        .join('')}`
    : `<div class="row" style="gap:10px">${avatar(PERSON_COLOR[name] || 'var(--ys)', 40, name)}<span style="flex:1"><b style="font-size:16px">${name}</b> ${vb(name)}<span class="mu" style="display:block;font-size:12px">${isVerified(name) ? tx('ID verified', 'ยืนยันตัวตนแล้ว') : tx('Not verified yet', 'ยังไม่ยืนยันตัวตน')}</span></span></div>
<button data-a="dmreport" class="opt" style="margin-top:14px">${ICON.shield(18)} ${tx('Report', 'รายงาน')}</button><button data-a="dmblock" class="opt">⛔ ${tx('Block', 'บล็อก') + ' ' + name}</button><button data-a="dmsafety" class="opt">${tx('Safety tips', 'คำแนะนำด้านความปลอดภัย')}</button>`;
  const d = document.createElement('div');
  d.id = 'ovl';
  d.className = 'sheet';
  d.innerHTML = `<div role="dialog" aria-label="${tx('Report or block', 'รายงานหรือบล็อก')}">${html}<button data-a="dmclose" class="btn gr" style="margin-top:12px">${tx('Cancel', 'ยกเลิก')}</button></div>`;
  d.addEventListener('click', (e) => e.target == d && ACTIONS.dmclose());
  $('#app').appendChild(d);
}

const personInfo = (name) => {
  const f = FRIENDS.find((x) => x.name == name),
    posts = S.posts.filter((p) => p.name == name && !p.mine),
    color = (f && f.color) || (posts[0] && posts[0].color) || PERSON_COLOR[name] || (ROOM.crowd.find((c) => c[0] == name) || [])[1] || '#C9D7F5',
    acts = [...new Set([f && f.going, ...posts.map((p) => p.act)].filter((i) => i && A[i]))],
    likes = (f && f.likes) || [...new Set(acts.map((i) => A[i].cat))].slice(0, 3),
    h = parseInt(hk(name), 36),
    reviews = REVIEWS2.filter((r) => r[0] == name);
  return { name, color, f, posts, acts, likes, reviews, bio: BIOS[name], joined: 12 + (h % 70), buddies: 3 + (h % 19), since: ['Mar', 'May', 'Jun', 'Aug', 'Sep'][h % 5] + ' 2026' };
};

// ── การเปลี่ยนหน้า: เลื่อนเข้า/ออก และรูปกิจกรรม/รูปคนขยายต่อเนื่องไปหน้าถัดไป (View Transitions)
// รูปใหญ่ในหน้ากิจกรรม (.evhero) ชื่อ 'hero' · รูปในหน้าโปรไฟล์ (.pp-av) ชื่อ 'pav' (ตั้งไว้ใน CSS)
let NAV_SRC = null;
const canVT = () => !!document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches;
const PIC_SEL = '.tile-img, .fg-ring, .who-av, img, [data-slot]';
const picOf = (el) => (el ? (el.matches(PIC_SEL) ? el : el.querySelector(PIC_SEL)) : null);
const vtName = (go) => (go && go.startsWith('person:') ? 'pav' : go && go.startsWith('event:') ? 'hero' : '');
function withTransition(update, dir, srcGo, srcEl) {
  const s = $('#scr');
  if (!canVT()) {
    update();
    s.classList.remove('nav-fwd', 'nav-back');
    void s.offsetWidth;
    s.classList.add(dir == 'back' ? 'nav-back' : 'nav-fwd');
    return;
  }
  const name = vtName(srcGo),
    pic = dir == 'fwd' && name && picOf(srcEl);
  if (pic) pic.style.viewTransitionName = name;
  document.documentElement.dataset.nav = dir;
  let tgt = null;
  const vt = document.startViewTransition(() => {
    if (pic) pic.style.viewTransitionName = '';
    update();
    if (dir == 'back' && name) {
      const el = [...document.querySelectorAll(`#scr [data-go="${srcGo}"]`)].find((e) => {
        const r = e.getBoundingClientRect();
        return r.bottom > 0 && r.top < innerHeight;
      });
      tgt = picOf(el);
      if (tgt) tgt.style.viewTransitionName = name;
    }
  });
  vt.finished.finally(() => {
    if (tgt) tgt.style.viewTransitionName = '';
    delete document.documentElement.dataset.nav;
  });
}

function render() {
  const cur = S.stack[S.stack.length - 1] || { n: S.tab };
  const [n, p] = [cur.n, cur.p];
  const scr = $('#scr');
  const sv = scr.scrollTop,
    same = render.l === n + p;
  render.l = n + p;
  SN = 0;
  CX = n;
  scr.innerHTML = SC[n](p) + (cur.sheet ? joinSheet(p) : '');
  scr.classList.toggle('full', FULL.includes(n));
  scr.scrollTop = same ? sv : 0;
  if (n == 'chat') {
    scr.scrollTop = scr.scrollHeight;
    if (same) {
      const c = $('#cm');
      if (c) c.focus();
    }
  }
  const nv = $('#nav');
  nv.classList.toggle('hide', FULL.includes(n));
  nv.innerHTML = Object.keys(NAV_ICONS)
    .map(
      (k) =>
        `<button data-tab="${k}" class="${S.tab == k ? 'on' : ''}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[k]}</svg>${NAV_LABELS[k]}</button>`,
    )
    .join('');
  drawTour();
  roomAfterRender(n, p);
  drawOverlay();
  if (n == 'home') pulseTick();
}

// ── ทัวร์แนะนำการใช้งาน: ไฮไลต์ทีละจุด แล้วมีกล่องข้อความ Next / Skip
function drawTour() {
  const old = $('#tour');
  if (old) old.remove();
  if (S.tourStep == null || S.stack.length || S.tab != 'home') return;
  const steps = TOUR.filter((t) => document.querySelector(t.sel));
  if (S.tourStep >= steps.length) return endTour();
  const st = steps[S.tourStep],
    el = document.querySelector(st.sel),
    app = $('#app'),
    scr = $('#scr');
  if (scr.contains(el)) scr.scrollTop = Math.max(0, el.offsetTop - 120);
  const ar = app.getBoundingClientRect(),
    r = el.getBoundingClientRect(),
    pad = 6,
    x = Math.max(4, r.left - ar.left - pad),
    y = r.top - ar.top - pad,
    w = Math.min(ar.width - 8 - x, r.width + pad * 2),
    h = r.height + pad * 2,
    below = y + h + 200 < ar.height,
    last = S.tourStep == steps.length - 1;
  const d = document.createElement('div');
  d.id = 'tour';
  d.setAttribute('role', 'dialog');
  d.setAttribute('aria-label', 'App tour');
  d.style.cssText = 'position:absolute;inset:0;z-index:60';
  d.innerHTML = `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:18px;box-shadow:0 0 0 9999px rgba(16,50,143,.62);border:2px solid var(--y);pointer-events:none"></div>
<div style="position:absolute;left:16px;right:16px;${below ? 'top:' + (y + h + 12) : 'bottom:' + (ar.height - y + 12)}px;background:#fff;border-radius:20px;padding:16px 18px"><div class="mu" style="font-size:11px;font-weight:700">${S.tourStep + 1} of ${steps.length}</div><b style="display:block;font-size:17px;margin-top:2px">${st.title}</b><div style="font-size:13px;margin-top:4px;line-height:1.5">${st.text}</div><div class="row" style="justify-content:space-between;margin-top:12px"><button data-a="tourskip" style="font-weight:600;color:var(--mu);padding:8px 0">Skip tour</button><button data-a="tournext" class="y" style="height:40px;padding:0 22px;border-radius:12px;font-weight:700">${last ? 'Got it' : 'Next'}</button></div></div>`;
  app.appendChild(d);
  const nb = d.querySelector('[data-a="tournext"]');
  if (nb) nb.focus();
}
function endTour() {
  S.tourStep = null;
  S.toured = true;
  lsSet('vybe.toured', true);
  const old = $('#tour');
  if (old) old.remove();
}

function toast(t) {
  const e = $('#toast');
  e.textContent = t;
  e.classList.add('s');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.remove('s'), 2000);
}

function go(s) {
  const i = s.indexOf(':'),
    src = NAV_SRC;
  NAV_SRC = null;
  if (s.startsWith('event:')) S.etab = 'details';
  S.stack.push(i < 0 ? { n: s } : { n: s.slice(0, i), p: s.slice(i + 1) });
  if (/^(room|processing)/.test(s)) return render();
  if (s.startsWith('event:')) {
    S.evT0 = Date.now();
    render();
    return evEnter();
  }
  withTransition(render, 'fwd', s, src);
}

const toTab = (tab, msg) => {
  S.stack = [];
  S.tab = tab;
  render();
  if (msg) toast(msg);
};

const openNewPost = (act, type = 'buddy') => {
  S.postType = type;

};

const sendChat = (id, text) => {
  getChat(id).push(['You', text, hhmm()]);

    pr = id.split('~');

  } else {
    const who = k == 'dm' ? pr[1] : [FRIENDS[0].name, 'Lisa', FRIENDS[1].name][Math.floor(Math.random() * 3)];
    const R = REPLIES_BY_LANG[personLang(who)] || CHAT_TEXT.replies;

    if (navigator.share) navigator.share({ title: 'Vybe Recap', text: txt }).catch(() => {});
    else if (navigator.clipboard)
      navigator.clipboard.writeText(txt).then(
        () => toast('Recap text copied'),
        () => toast('Sharing isn’t available here'),
      );
    else toast('Sharing isn’t available here');
  },

  // ── settings & alerts
  tg: (x) => {
    S.toggles[x] = !S.toggles[x];
    render();
  },
  // หลังยืนยัน OTP / Google / Apple: ผู้ใช้เดิม → Home ทันที · ผู้ใช้ใหม่ → ตั้งค่าโปรไฟล์ + คำถาม
  auth: () => {
    if (S.onboarded) {
      S.loggedIn = true;
      lsSet('vybe.loggedIn', true);
      S.stack = [];
      S.tab = 'home';
      render();
      toast('Welcome back, ' + USER.name);
    } else go('setup');
  },
  logout: () => {
    S.loggedIn = false;
    lsSet('vybe.loggedIn', false);
    S.stack = [{ n: 'signup' }];
    render();
  },
  // ── onboarding
  setupdone: () => {
    const v = ($('#nm') || {}).value;
    if (v != null && !v.trim()) return toast('Enter your name to continue');
    if (v) (USER.name = v.trim()), lsSet('vybe.name', USER.name);
    S.qstep = 0;
    S.quizFrom = null;
    go('quiz');
  },
  qpick: (k, v) => {
    const q = QUIZ.find((x) => x.key == k);
    if (q.multi) {
      const a = S.prefs[k],
        i = a.indexOf(v);
      i > -1 ? a.splice(i, 1) : a.push(v);
    } else S.prefs[k] = S.prefs[k] == v ? '' : v;
    savePrefs();
    render();
  },
  qnext: () => {
    if (S.qstep < QUIZ.length - 1) {
      S.qstep++;
      return render();
    }
    ACTIONS.qdone();
  },
  qskip: () => ACTIONS.qdone(),
  qdone: () => {
    savePrefs();
    if (S.quizFrom) {
      const from = S.quizFrom;
      S.quizFrom = null;
      if (from == 'home') toTab('home', hasPrefs() ? 'Your picks are ready' : '');
      else {
        S.stack.pop();
        render();
        toast('Preferences saved · Home updated');
      }
      return;
    }
    S.stack = [{ n: 'sync' }];
    render();
  },
  qback: () => {
    if (S.qstep > 0) {
      S.qstep--;
      return render();
    }
    S.stack.pop();
    render();
  },
  onbdone: () => {
    S.onboarded = S.loggedIn = true;
    lsSet('vybe.onboarded', true);
    lsSet('vybe.loggedIn', true);
    S.stack = [];
    S.tab = 'home';
    S.cat = 'All';
    if (!S.toured) S.tourStep = 0;
    render();
  },
  editprefs: () => {
    S.qstep = 0;
    S.quizFrom = S.stack.length ? 'settings' : 'home';
    go('quiz');
  },
  tournext: () => {
    S.tourStep++;
    render();
  },
  tourskip: () => endTour(),
  replaytour: () => {
    S.stack = [];
    S.tab = 'home';
    S.cat = 'All';
    S.tourStep = 0;
    render();
  },
  resetdemo: () => {
    ['vybe.prefs', 'vybe.toured', 'vybe.name', 'vybe.myPhoto', 'vybe.onboarded', 'vybe.loggedIn', 'vybe.verified', 'vybe.trusted'].forEach((k) => {
      try {
        localStorage.removeItem(k);
      } catch (e) {}
    });
    S.prefs = { cats: [], level: '', time: [], budget: '', style: '' };
    S.toured = false;
    S.onboarded = S.loggedIn = false;
    S.verified = false;
    S.trusted = '';
    S.myPhoto = '';
    USER.name = 'Jennie Kim';
    S.stack = [{ n: 'signup' }];
    render();
    toast('Reset · sign up again to see the new-user flow');
  },
  alt: (x) => {
    S.alt = x;
    render();
  },
  usealt: (x) => {
    const al = ALERTS.find((q) => q.id == x),
      i = S.plan.findIndex((p) => p.id == al.act);
    if (!S.alt) return toast('No alternative selected');
    if (i > -1) {
      S.plan.splice(i, 1);
      addToPlan(S.alt);
    }
    toTab('schedule', 'Switched to ' + A[S.alt].title + ' · group notified');
  },
};
Object.assign(ACTIONS, FEATURE_ACTIONS, {
  pconn: (n) => {
    const fi = FRIENDS.findIndex((x) => x.name == n);
    if (fi > -1) S.connected[fi] = !S.connected[fi];
    else S.pconn[n] = !S.pconn[n];
    render();
    if (fi > -1 ? S.connected[fi] : S.pconn[n]) toast(tx('Connected with ' + n, 'เชื่อมต่อกับ ' + n + ' แล้ว'));
  },
  unblock: (n) => {
    delete S.blocked[n];
    render();
    toast(tx('Unblocked ' + n, 'เลิกบล็อก ' + n + ' แล้ว'));
  },
});

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-a],[data-go]')) return;
  const t = e.target.closest('[data-tab],[data-go],[data-a]');
  if (!t) return;
  if ($('#pt')) S.draft = $('#pt').value;
  if (t.dataset.tab) return toTab(t.dataset.tab);
  if (t.dataset.go) {
    e.preventDefault();
    NAV_SRC = t;
    return go(t.dataset.go);
  }
  const raw = t.dataset.a;
  if (raw.startsWith('toast:')) return toast(raw.slice(6));
  const [a, x, y] = raw.split(':');
  if (ACTIONS[a]) ACTIONS[a](x, y, e);
});

// ช่องพิมพ์: อัปเดต state โดยไม่วาดทั้งหน้าใหม่ (เคอร์เซอร์จะได้ไม่หลุด)
const fmtCardNum = (v) => v.replace(/\D/g, '').slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 ');
const fmtExp = (v) => {
  const d = v.replace(/\D/g, '').slice(0, 4);
  return d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d;
};
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id == 'dq') {
    S.q = t.value;
    $('#dl').innerHTML = discoverList();
  } else if (t.id == 'ps') {
    S.ps = t.value;
    $('#pl').innerHTML = attachList();
  } else if (t.id == 'cq') {
    S.cq = t.value;
    $('#cl').innerHTML = communityList();
  } else if (t.id == 'promo') S.pay.promo = t.value;
  else if (t.id == 'cnum') S.pay.card.num = t.value = fmtCardNum(t.value);
  else if (t.id == 'cexp') S.pay.card.exp = t.value = fmtExp(t.value);
  else if (t.id == 'ccvc') S.pay.card.cvc = t.value = t.value.replace(/\D/g, '').slice(0, 4);
  else if (t.id == 'cname') S.pay.card.name = t.value;
  else if (t.id == 'nm') USER.name = t.value;
});

// เลือกรูปโปรไฟล์จากเครื่อง (จำไว้ในเบราว์เซอร์เครื่องนี้ รีเฟรชแล้วยังอยู่)
document.addEventListener('change', (e) => {
  if (e.target.id != 'photo' || !e.target.files || !e.target.files[0]) return;
  const f = e.target.files[0];
  if (!/^image\//.test(f.type)) return toast('Choose an image file');
  const r = new FileReader();
  r.onload = () => {
    S.myPhoto = r.result;
    try { localStorage.setItem('vybe.myPhoto', r.result); } catch (e) {}
    render();
    toast('Profile photo updated');
  };
  r.readAsDataURL(f);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'cm') {
    const b = document.querySelector('[data-a^="send:"]');
    if (b) b.click();
  }
  if (e.key === 'Enter' && e.target.id === 'promo') ACTIONS.promo();
  if (e.key === 'Escape' && S.tourStep != null) endTour();
});

// นับถอยหลังอายุ QR PromptPay
setInterval(() => {
  const el = $('#qrt');
  if (!el) return;
  const left = Math.max(0, 900 - Math.floor((Date.now() - S.qrStart) / 1000));
  el.textContent = Math.floor(left / 60) + ':' + pad2(left % 60);
}, 1000);

// เปิดแอป: ยังเข้าสู่ระบบอยู่ → Home · ยังไม่เคยใช้ หรือออกจากระบบแล้ว → หน้าสมัคร
I18N_OBS.observe($('#app'), { childList: true, subtree: true, characterData: true });
// ── เลื่อนแถวแนวนอนด้วยเมาส์: ลากซ้าย-ขวา หรือหมุนล้อเมาส์ขณะชี้อยู่บนแถว (คอมพิวเตอร์ไม่มีการปัดนิ้ว)
const HSEL = '.hmscroll, .fg-row, .who-row, #scr [style*="overflow-x:auto"]';
const hRow = (t) => {
  const el = t && t.closest && t.closest(HSEL);
  return el && el.scrollWidth > el.clientWidth + 2 ? el : null;
};
let DRAG = null,
  DRAGGED = false;
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType != 'mouse' || e.button) return;
  const el = hRow(e.target);
  if (el) DRAG = { el, x: e.clientX, sl: el.scrollLeft, moved: false };
});
document.addEventListener('pointermove', (e) => {
  if (!DRAG) return;
  const dx = e.clientX - DRAG.x;
  if (!DRAG.moved && Math.abs(dx) > 5) (DRAG.moved = true), DRAG.el.classList.add('dragging');
  if (DRAG.moved) DRAG.el.scrollLeft = DRAG.sl - dx;
});
const endDrag = () => {
  if (!DRAG) return;
  if (DRAG.moved) {
    DRAGGED = true;
    setTimeout(() => (DRAGGED = false), 0);
  }
  DRAG.el.classList.remove('dragging');
  DRAG = null;
};
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
// ลากเสร็จแล้วไม่นับเป็นการกด (จะได้ไม่เปิดกิจกรรมโดยไม่ตั้งใจ)
document.addEventListener('click', (e) => DRAGGED && (e.stopPropagation(), e.preventDefault(), (DRAGGED = false)), true);
document.addEventListener('dragstart', (e) => hRow(e.target) && e.preventDefault());
// ล้อเมาส์บนแถว → เลื่อนซ้าย-ขวา (สุดแถวแล้วจะเลื่อนหน้าต่อตามปกติ)
document.addEventListener(
  'wheel',
  (e) => {
    const el = hRow(e.target);
    if (!el || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const max = el.scrollWidth - el.clientWidth;
    if ((e.deltaY < 0 && el.scrollLeft <= 0) || (e.deltaY > 0 && el.scrollLeft >= max - 1)) return;
    e.preventDefault();
    el.scrollLeft += e.deltaY;
  },
  { passive: false },
);

S.stack = S.loggedIn ? [] : [{ n: 'signup' }];
render();
</script></body></html>
