<style>
:root {
  --n: #10328f;
  --b: #5b88d6;

}
@media (prefers-color-scheme: dark) {

  }
}
:root[data-theme="dark"] {
  --bg: #0d1431;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {

  color: var(--n);
  display: flex;
  align-items: center;
  justify-content: center;
}
#app {
  width: 390px;
  height: min(844px, 100%);
  background: #fff;
  border-radius: 36px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(16, 50, 143, 0.25);
}
@media (max-width: 500px) {
  #app {
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
}
#scr {
  position: absolute;
  inset: 0 0 76px;
  overflow-y: auto;
  padding-bottom: 16px;
}
#scr.full {
  bottom: 0;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: 0;
  color: inherit;
  background: none;
}
h1 {
  margin: 0;
}
.p {

}
.mu {
  color: var(--mu);
}
.row {

  align-items: center;
  gap: 10px;
}
.btn {
  height: 50px;
  border-radius: 25px;
  font-weight: 700;
  font-size: 15px;
  width: 100%;
}
.y {
  background: var(--y);
  color: var(--n);
}
.nb {
  background: var(--n);
  color: #fff;
}
.bb {
  background: var(--b);
  color: #fff;
}
.lb {
  background: var(--l);
}
.gr {
  background: #eef1f8;
}
.card {
  border: 1.5px solid var(--bd);
  border-radius: 20px;
  padding: 10px;
}
.chip {
  flex: none;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  border: 1.5px solid #b9c9ee;
}
.chip.on {
  background: var(--b);
  color: #fff;
  border-color: var(--b);
}
.tag {
  background: var(--ys);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
}
.inp {
  height: 48px;
  border: 1.5px solid var(--bd);
  border-radius: 12px;
  padding: 0 14px;
  font: inherit;
  font-size: 15px;
  color: var(--n);
  width: 100%;
  box-sizing: border-box;
}
#nav {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 76px;
  background: #fff;
  border-top: 1.5px solid var(--bd);
  display: flex;
  justify-content: space-around;
  align-items: center;
}
#nav.hide {
  display: none;
}
#nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  width: 80px;
  color: var(--mu);
}
#nav button.on {
  color: var(--n);
}
#nav button.on svg {
  stroke: var(--y);
}
.sheet {
  position: absolute;
  inset: 0;
  background: rgba(16, 50, 143, 0.45);
  display: flex;
  align-items: flex-end;
}
.sheet > div {
  background: #fff;
  border-radius: 28px 28px 0 0;
  padding: 20px;
  width: 100%;
  box-sizing: border-box;
}
.opt {
  display: flex;
  gap: 12px;
  align-items: center;
  border: 1.5px solid var(--bd);
  border-radius: 16px;
  padding: 12px 14px;
  margin-top: 10px;
  width: 100%;
  text-align: left;
}
.opt.on {
  border-color: var(--b);
  background: var(--l);
}
.rad {

  height: 20px;
  border-radius: 10px;
  border: 2px solid #b9c9ee;
  flex: none;
}
.on .rad {
  border: 6px solid var(--b);

#toast {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 92px;
  background: var(--n);
  color: #fff;
  border-radius: 16px;
  padding: 12px 16px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  text-align: center;
}
#toast.s {
  opacity: 1;
}

  outline: 3px solid var(--y);
  outline-offset: 2px;
}

// ภาษาในแอปเป็นภาษาอังกฤษทั้งหมด คอมเมนต์ในโค้ดเป็นภาษาไทยเพื่อให้ทีมแก้ง่าย
//
// อ่านจากบนลงล่าง: 1 รูป → 2 ข้อมูล → 3 state → 4-5 ตัวช่วย → 6 หน้าจอ → 7 ตัวรัน
//
// ★ หลักสำคัญ: ข้อมูลทุกอย่างเขียน "ที่เดียว" ในส่วน 2 (DATA)
//   - เพิ่มกิจกรรม = คัดลอกบล็อก { id: ... } 1 อันใน ACTIVITIES แล้วแก้ค่า
//     กิจกรรมจะโผล่เองทุกหน้า: Home, Discover, ค้นหา, Compare, หน้าคลับ, หน้าแนบโพสต์, Replan
//   - เพิ่มคลับ = เพิ่ม 1 บรรทัดใน CLUBS แล้วใส่ id ของคลับในช่อง club ของกิจกรรม
//   - เพิ่มหมวด = เพิ่มชื่อใน CATEGORIES (ปุ่มหมวดในหน้า Home/Discover สร้างให้เอง)
//   - ที่อื่น (แผน, โพสต์, Recap, เพื่อน, แจ้งเตือน) อ้างถึงกิจกรรมด้วย id อย่างเดียว ไม่ต้องพิมพ์ชื่อ/เวลา/ราคาซ้ำ
//
// ปุ่มในหน้า: data-go="screen:param" = ไปหน้าอื่น | data-a="action:x:y" = ทำงาน (ดูส่วน 7)

// ════════════════════════════════════════════════════════════
// 1. IMAGES — วางรูป base64 ที่นี่ (ใส่เฉพาะอันที่มีรูป ไม่ต้องใส่ครบ)

     ตัวอย่าง:  activities: { run: 'data:image/jpeg;base64,/9j/4AAQ...', climb: 'data:...' }
     id คือค่า id ของกิจกรรมใน ACTIVITIES (ส่วน 2) / id ของคลับใน CLUBS
  2) รูปเดียวต่อกิจกรรมใช้ได้ทุกที่ที่กิจกรรมนั้นโผล่ (ระบบครอปแบบ cover ให้เอง)
     ลำดับการหารูป: รูปของกิจกรรมนั้น → รูปประจำหมวด (categories) → กล่องสีเทา
     ทางลัด: ใส่แค่ categories หมวดละรูป ทุกกิจกรรมในหมวดจะมีรูปทันที
  3) ไม่ใส่ = กล่องสีเทา และคอมเมนต์ <!-- IMAGE SLOT ... key=id --> ในหน้าเว็บบอกตำแหน่ง
  4) ตั้ง SHOW_SLOT_SIZES = false ถ้าไม่อยากให้กล่องเทาโชว์ตัวเลขขนาด

  รูปกิจกรรม แนะนำ 1170×900 px (13:10) JPEG/WebP ไม่เกิน ~150 KB วางวัตถุสำคัญไว้กลางภาพ
  ────────────────────────────────────────────────────────────
  Event detail: ภาพบนสุด          390×300   →  780×600
  Home: การ์ด Upcoming            160×92    →  320×184
  Discovery: การ์ดผลลัพธ์         100×92    →  200×184
  Recap: รูปในการ์ด               280×257   →  560×514
  Profile: ช่อง Recap             106×97    →  212×194
  Route: แผนที่                   350×200   →  700×400   (misc.map)
  Sync contacts: รูปด้านบน        170×156   →  340×312   (misc.sync)

  รูป Recap: ไม่ต้องใส่ ใช้รูปของกิจกรรมนั้นให้อัตโนมัติ
*/

const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const toDate = (d) => {
  const [y, m, dd] = d.split('-').map(Number);
  return new Date(y, m - 1, dd);
};
const fmtDay = (d) => {
  const x = toDate(d);
  return DAYS[x.getDay()] + ' ' + x.getDate() + ' ' + MONTHS[x.getMonth()];
};
const fmtDate = (d) => {
  const x = toDate(d);
  return x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + x.getFullYear();
};
const fmtMins = (m) => {
  m = Math.max(1, Math.round(m));
  const h = Math.floor(m / 60),
    r = m % 60;
  return (h ? h + ' hr' : '') + (h && r ? ' ' : '') + (r ? r + ' min' : '');
};
const money = (n) => (n ? '฿' + n.toLocaleString('en-US') : 'Free');

const CLUB = Object.fromEntries(CLUBS.map((c) => [c.id, c]));

// A[id] = กิจกรรมพร้อมค่าที่ใช้แสดงผล
const A = {};
ACTIVITIES.forEach((a) => {
  const c = CLUB[a.club] || { name: a.club, type: 'club' };
  A[a.id] = Object.assign({}, a, {
    clubName: c.name,
    day: fmtDay(a.date),
    when: fmtDay(a.date) + ' · ' + a.time,
    priceLabel: money(a.price),
    duration: fmtMins(a.mins),
    tag: a.badge || a.level + (a.indoor ? ' · Indoor' : ''),
    beginner: a.level == 'Beginner' || a.level == 'All levels',
    byClub: c.type == 'club',
    kmLabel: a.km + ' km',
    ratingLabel: a.rating.toFixed(1) + ' (' + a.reviews + ')',
  });
});

const sortKey = (a) => a.date + ' ' + a.time;

const UPCOMING = Object.values(A)
  .filter((a) => a.date >= TODAY)
  .sort((x, y) => (sortKey(x) < sortKey(y) ? -1 : 1))

const toMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const indoorAlternatives = (id, n = 3) => {
  const a = A[id];
  return Object.values(A)
    .filter((x) => x.indoor && x.date == a.date && x.id != id && !S.plan.some((p) => p.id == x.id))

    .slice(0, n)
    .map((x) => x.id);
};

// ════════════════════════════════════════════════════════════

let SN = 0,
  CX = '';

// ลำดับการหารูปของกิจกรรม: รูปเฉพาะกิจกรรม → รูปประจำหมวด → กล่องสีเทา
const activityImg = (id) => IMAGES.activities[id] || IMAGES.categories[(A[id] || {}).cat] || '';

const imgSrc = (key) => {
  const t = key.split(':')[0],
    id = key.slice(t.length + 1);
  if (t == 'club') return IMAGES.clubs[id] || '';
  if (t == 'misc') return IMAGES.misc[id] || '';
  if (t == 'recap') {
    const r = S.recaps.find((q) => q.id == id);
    return IMAGES.recaps[id] || (r ? activityImg(r.act) : '');
  }
  return activityImg(key);
};

const mapBlock = (a) => {
  if (!USE_LIVE_MAP) return imgSlot('misc:map', 350, 22, 'ROUTE › map image', 200);
  const q = encodeURIComponent(a.place + ' ' + a.area);
  const src = MAPS_API_KEY
    ? `https://www.google.com/maps/embed/v1/place?key=${MAPS_API_KEY}&q=${q}`
    : `https://maps.google.com/maps?q=${q}&z=15&output=embed`;
  return `<iframe title="Map of ${a.place}" src="${src}" width="350" height="200" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="border:0;border-radius:22px;display:block"></iframe>`;
};

const imgSlot = (key, w, r, label, h) => {
  h = h || Math.round((w * 110) / 120);
  const src = imgSrc(key),
    L = label || key,
    rad = r == null ? 16 : r;
  if (src)
    return `<img src="${src}" alt="${L}" width="${w}" height="${h}" style="width:${w}px;height:${h}px;border-radius:${rad}px;object-fit:cover;flex:none;display:block">`;
  SN++;
  const id = CX + ' #' + SN;
  return (
    `<!-- IMAGE SLOT ${id}: ${L} | key=${key} | ${w}x${h} CSS px (export ${w * 2}x${h * 2}) -->` +
    `<div data-slot="${id}" data-key="${key}" role="img" aria-label="Image placeholder: ${L}" style="width:${w}px;height:${h}px;border-radius:${rad}px;background:#E6EAF3;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;line-height:1.3;color:#8A96BE;overflow:hidden">${SHOW_SLOT_SIZES ? (w >= 80 ? w + '×' + h + '<br>use ' + w * 2 + '×' + h * 2 : w >= 44 ? w + '×' + h : '') : ''}</div>`
  );
};

// ── PAYMENT helpers
const resetPay = (qty = 1) => {
  S.pay = {
    method: S.savedCard ? 'card' : 'promptpay',
    useSaved: !!S.savedCard,
    qty,
    promo: '',
    promoOk: null,
    card: { num: '', exp: '', cvc: '', name: '' },
    save: true,
    err: '',
  };
};
const quote = (id) => {
  const a = A[id],
    q = S.pay.qty,
    sub = a.price * q,
    fee = a.price ? SERVICE_FEE * q : 0,
    p = S.pay.promoOk && PROMOS[S.pay.promoOk],
    discount = p ? (p.pct ? Math.round((sub * p.pct) / 100) : Math.min(p.off, sub)) : 0;
  return { qty: q, sub, fee, discount, total: sub + fee - discount };
};
const methodName = () => {
  if (S.pay.method == 'card') {
    if (S.pay.useSaved && S.savedCard) return S.savedCard.brand + ' •••• ' + S.savedCard.last4;
    const n = S.pay.card.num.replace(/\D/g, '');
    if (n.length == 16) return cardBrand(n) + ' •••• ' + n.slice(-4);
  }
  return PAY_METHODS.find((m) => m.id == S.pay.method).name;
};
const cardBrand = (n) => (/^4/.test(n) ? 'Visa' : /^5/.test(n) ? 'Mastercard' : /^35/.test(n) ? 'JCB' : 'Card');
const cardError = () => {
  const c = S.pay.card,
    n = c.num.replace(/\D/g, ''),
    m = c.exp.match(/^(\d\d)\/(\d\d)$/);
  if (n.length != 16) return 'Enter the 16-digit card number.';
  if (!m || +m[1] < 1 || +m[1] > 12) return 'Enter the expiry date as MM/YY.';
  if (+m[2] < 26 || (+m[2] == 26 && +m[1] < 10)) return 'This card has expired. Use another card.';
  if (!/^\d{3,4}$/.test(c.cvc)) return 'Enter the 3-digit security code on the back of the card.';
  if (!c.name.trim()) return 'Enter the name on the card.';
  return '';
};
const startProcessing = (id, declined) => {
  S.stack.push({ n: 'processing', p: id });
  render();
  setTimeout(() => {
    if (declined) {
      S.stack.pop();
      S.pay.err = 'Your card was declined. Try another card or another payment method.';
      render();
      return;
    }
    completePayment(id);
  }, 1600);
};
const completePayment = (id) => {
  const q = quote(id),
    ref = newRef(),
    now = new Date();
  addToPlan(id);
  Object.assign(planItem(id), { status: 'Booked', ref, qty: q.qty });
  if (S.pay.method == 'card' && !S.pay.useSaved && S.pay.save) {
    const n = S.pay.card.num.replace(/\D/g, '');
    S.savedCard = { brand: cardBrand(n), last4: n.slice(-4) };
  }
  S.payments.unshift({ ref, act: id, ...q, method: methodName(), at: fmtDate(TODAY) + ' · ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) });
  S.lastRef = ref;
  S.stack = [{ n: 'receipt', p: ref }];
  S.tab = 'schedule';
  render();
};

<div style="margin:14px 28px 0;background:var(--y);border-radius:28px;padding:18px;text-align:center"><div style="font-size:12px">Recap · ${r.dateLabel}</div>
<div style="font-size:22px;font-weight:800;margin:2px 0 12px">${r.title}</div>${imgSlot('recap:' + r.id, 280, 22, 'RECAP › activity photo · ' + r.title)}<div style="text-align:left;margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:14px">${[
        ['Place', r.place],
        ['Time', r.duration],
        ['Together', r.people + ' people'],
        ['Community', r.club],
      ]
        .map((q) => `<div class="row" style="justify-content:space-between"><span>${q[0]}</span><b style="text-align:right">${q[1]}</b></div>`)
        .join('')}</div>
</div><div class="row" style="margin:16px 28px 0"><button data-a="share:${r.id}" class="btn nb" style="flex:1;height:46px;font-size:13px">Share Recap</button><button data-a="sharepost:${r.act}" class="btn nb" style="flex:1;height:46px;font-size:13px;background:var(--b)">Post to Community</button></div>`
    );

  settings: () => {
    const tg = (k, t) =>
      `<div class="row" style="margin:0 20px;padding:14px 0;border-bottom:1px solid #EEF1FA;justify-content:space-between"><span>${t}</span><button data-a="tg:${k}" role="switch" aria-checked="${S.toggles[k]}" aria-label="${t}" style="width:46px;height:28px;border-radius:14px;position:relative;background:${S.toggles[k] ? 'var(--b)' : '#CBD3EA'}"><span style="position:absolute;top:3px;left:${S.toggles[k] ? 21 : 3}px;width:22px;height:22px;border-radius:11px;background:#fff"></span></button></div>`;
    const link = (go, t) =>
      `<button data-go="${go}" class="row" style="margin:0 20px;padding:14px 0;border-bottom:1px solid #EEF1FA;justify-content:space-between;width:calc(100% - 40px)"><span>${t}</span>›</button>`;
    return (
      back +
      hdr('Settings', 'Settings') +
      `<div class="row" style="margin:14px 20px 0;padding:14px 0;border-bottom:1px solid #EEF1FA;justify-content:space-between"><span>Phone number</span><b>${USER.phone}</b></div>` +
      link('saved', `Saved activities (${S.saved.length})`) +
      link('payments', `Payments & receipts (${S.payments.length})`) +
      tg('sync', 'Sync contacts') +
      tg('calendar', 'Sync plan to phone calendar') +
      tg('alerts', 'PM2.5 and flood alerts') +
      tg('clubs', 'New activities from clubs I follow') +
      `<div style="margin:24px 20px 0"><button data-a="logout" class="btn gr">Log out</button></div>`
    );
  },
};

// ════════════════════════════════════════════════════════════
// 7. RUNTIME — วาดหน้าจอ รับการกด และเริ่มแอป
// ════════════════════════════════════════════════════════════

function render() {
  const cur = S.stack[S.stack.length - 1] || { n: S.tab };
  const [n, p] = [cur.n, cur.p];
  const scr = $('#scr');
  const sv = scr.scrollTop,
    same = render.l === n + p;
  render.l = n + p;
  SN = 0;
  CX = n;
  scr.innerHTML = SC[n](p) + (cur.sheet ? joinSheet(p) : '');
  scr.classList.toggle('full', FULL.includes(n));
  scr.scrollTop = same ? sv : 0;
  if (n == 'chat') {
    scr.scrollTop = scr.scrollHeight;
    if (same) {
      const c = $('#cm');
      if (c) c.focus();
    }
  }
  const nv = $('#nav');
  nv.classList.toggle('hide', FULL.includes(n));
  nv.innerHTML = Object.keys(NAV_ICONS)
    .map(
      (k) =>
        `<button data-tab="${k}" class="${S.tab == k ? 'on' : ''}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[k]}</svg>${NAV_LABELS[k]}</button>`,
    )
    .join('');
}

function toast(t) {
  const e = $('#toast');
  e.textContent = t;
  e.classList.add('s');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.remove('s'), 2000);
}

function go(s) {
  const i = s.indexOf(':');
  S.stack.push(i < 0 ? { n: s } : { n: s.slice(0, i), p: s.slice(i + 1) });
  render();
}

const toTab = (tab, msg) => {
  S.stack = [];
  S.tab = tab;
  render();
  if (msg) toast(msg);
};

const openNewPost = (act, type = 'buddy') => {
  S.postType = type;
  S.att = act || null;
  S.addPlan = true;
  S.draft = '';
  go('newpost');
};

const sendChat = (id, text) => {
  getChat(id).push(['You', text, hhmm()]);
  render();
  const k = chatKind(id),
    pr = id.split('~');
  if (k == 'club') {
    const f = CLUB_FAQ.find((x) => x[0] == text);
    replyLater(id, CLUB[pr[1]].name, f ? f[1] : CHAT_TEXT.clubFallback);
  } else {
    const who = k == 'dm' ? pr[1] : [FRIENDS[0].name, 'Lisa', FRIENDS[1].name][Math.floor(Math.random() * 3)];
    replyLater(id, who, CHAT_TEXT.replies[Math.floor(Math.random() * CHAT_TEXT.replies.length)]);
  }
};

// ทุกปุ่ม data-a="ชื่อ:x:y" มาที่นี่
const ACTIONS = {
  back: () => {
    S.stack.pop();
    render();
  },
  done: () => toTab('schedule'),
  conn: (x) => {
    S.connected[x] = !S.connected[x];
    render();
  },
  join: () => {
    S.how = 'buddy';
    S.stack[S.stack.length - 1].sheet = true;
    render();
  },
  closesheet: (x, y, ev) => {
    if (ev.target.classList.contains('sheet')) {
      S.stack[S.stack.length - 1].sheet = false;
      render();
    }
  },
  how: (x) => {
    S.how = x;
    render();
  },
  confirm: (x) => {
    addToPlan(x);
    const a = A[x];
    if (S.how == 'buddy') {
      S.draft = 'หาเพื่อนไป ' + a.title + ' ' + a.day + ' ใครสนใจทักมาได้เลย';
      S.att = x;
      S.stack = [{ n: 'buddypost', p: x }];
      render();
      toast('Added to your plan · now find a buddy');
    } else if (a.price) {
      resetPay(S.how == 'friends' ? 2 : 1);
      S.tab = 'schedule';
      S.stack = [{ n: 'payment', p: x }];
      render();
      toast('Added to your plan · complete payment to confirm');
    } else toTab('schedule', S.how == 'friends' ? 'Booked · invites sent to friends' : 'Booked · added to My Schedule');
  },
  skipbuddy: (x) => {
    if (A[x].price && planItem(x).status == 'Unpaid') {
      resetPay();
      S.tab = 'schedule';
      S.stack = [{ n: 'payment', p: x }];
      render();
    } else toTab('schedule');
  },

  // ── payment
  pay: (x) => {
    resetPay();
    go('payment:' + x);
  },
  pm: (x) => {
    if (S.pay.method == x) return;
    S.pay.method = x;
    S.pay.err = '';
    render();
  },
  newcard: () => {
    S.pay.useSaved = false;
    render();
  },
  savecard: () => {
    S.pay.save = !S.pay.save;
    render();
  },
  qty: (x) => {
    S.pay.qty = Math.max(1, Math.min(MAX_TICKETS, S.pay.qty + +x));
    render();
  },
  promo: () => {
    const c = S.pay.promo.trim().toUpperCase();
    if (PROMOS[c]) {
      S.pay.promoOk = c;
      S.pay.err = '';
      toast(c + ' applied · ' + PROMOS[c].label);
    } else {
      S.pay.promoOk = null;
      S.pay.err = c ? 'The code “' + c + '” isn’t valid. Check the spelling and try again.' : 'Enter a promo code first.';
    }
    render();
  },
  rmpromo: () => {
    S.pay.promoOk = null;
    S.pay.promo = '';
    render();
  },
  paynow: (x) => {
    S.pay.err = '';
    if (S.pay.method == 'card' && !(S.pay.useSaved && S.savedCard)) {
      const er = cardError();
      if (er) {
        S.pay.err = er;
        return render();
      }
      return startProcessing(x, S.pay.card.num.replace(/\D/g, '') == DECLINED_CARD);
    }
    if (S.pay.method == 'card') return startProcessing(x);
    if (S.pay.method == 'promptpay') {
      S.qrStart = Date.now();
      return go('payqr:' + x);
    }
    toast('Opening ' + methodName() + '… (simulated)');
    startProcessing(x);
  },
  qrpaid: (x) => startProcessing(x),
  rmcard: () => {
    S.savedCard = null;
    render();
    toast('Card removed');
  },

  // ── discover & compare
  cmp: (x) => {
    const q = S.compare.indexOf(x);
    if (q > -1) S.compare.splice(q, 1);
    else if (S.compare.length < 3) S.compare.push(x);
    else toast('You can compare up to 3');
    render();
  },
  cat: (x) => {
    S.cat = x;
    render();
  },
  flt: (x) => {
    S[x] = !S[x];
    render();
  },

  // ── community & posts
  ctab: (x) => {
    S.ctab = x;
    render();
  },
  'ctab-go': (x) => {
    S.ctab = x;
    toTab('community');
  },
  newpost: () => openNewPost(null, 'buddy'),
  postfor: (x) => openNewPost(x, 'buddy'),
  sharepost: (x) => openNewPost(x, 'share'),
  ptype: (x) => {
    S.postType = x;
    S.att = null;
    render();
  },
  att: (x) => {
    S.att = x;
    render();
  },
  addplan: () => {
    S.addPlan = !S.addPlan;
    render();
  },
  post: () => (S.att ? makePost(S.att, S.postType) : toast('Attach an activity first')),
  mypost: (x) => makePost(x, 'buddy'),
  fol: (x) => {
    S.following[x] = !S.following[x];
    render();
    toast(S.following[x] ? 'Following ' + CLUB[x].name + ' · you’ll be notified about new activities' : 'Unfollowed ' + CLUB[x].name);
  },
  fav: (x) => {
    const q = S.saved.indexOf(x);
    if (q > -1) S.saved.splice(q, 1);
    else S.saved.push(x);
    render();
    toast(q > -1 ? 'Removed from saved' : 'Saved');
  },
  acc: (x, y) => {
    const p = S.posts.find((q) => q.id == x);
    p.interested[y].accepted = true;
    render();
    toast(p.interested[y].name + ' was added to the group chat');
  },
  pj: (x) => {
    const p = S.posts.find((q) => q.id == x);
    S.joinReq[x] = 'pending';
    render();
    toast('Request sent to ' + p.name);
    setTimeout(() => {
      S.joinReq[x] = 'joined';
      addToPlan(p.act);
      getChat(p.act).push([p.name, CHAT_TEXT.welcome, hhmm()]);
      render();
      toast(p.name + ' accepted · added to My Schedule and group chat');
    }, 2200);
  },

  // ── chat
  send: (x) => {
    const el = $('#cm'),
      v = el && el.value.trim();
    if (v) sendChat(x, v);
  },
  faq: (x, y) => sendChat(x, CLUB_FAQ[+y][0]),

  // ── schedule, calendar, route
  rt: (x) => {
    S.route = +x;
    render();
  },
  calday: (x) => {
    S.calDay = x;
    render();
  },
  calm: (x) => {
    let [y, m] = S.calMonth.split('-').map(Number);
    m += +x;
    if (m < 1) (m = 12), y--;
    if (m > 12) (m = 1), y++;
    S.calMonth = y + '-' + pad2(m);
    render();
  },
  calsync: () => {
    S.toggles.calendar = !S.toggles.calendar;
    render();
    toast(S.toggles.calendar ? S.plan.length + ' activities added to your phone calendar (simulated)' : 'Calendar sync turned off');
  },
  addcal: (x) => toast(A[x].title + ' added to your phone calendar (simulated)'),
  finish: (x) => {
    const a = A[x];
    let r = S.recaps.find((q) => q.id == 'e' + x);
    if (!r) {
      r = { id: 'e' + x, act: x, date: a.date, people: a.going };
      S.recaps.unshift(r);
    }
    const p = planItem(x);
    if (p) p.status = 'Done';
    S.stack = [{ n: 'recap', p: r.id }];
    render();
    toast('Recap created · added to your profile');
  },
  share: (x) => {
    const r = recapView(S.recaps.find((q) => q.id == x)),
      txt = 'ไป ' + r.title + ' ที่ ' + r.place + ' มา ' + r.duration + ' กับเพื่อน ' + r.people + ' คน #Vybe';
    if (navigator.share) navigator.share({ title: 'Vybe Recap', text: txt }).catch(() => {});
    else if (navigator.clipboard)
      navigator.clipboard.writeText(txt).then(
        () => toast('Recap text copied'),
        () => toast('Sharing isn’t available here'),
      );
    else toast('Sharing isn’t available here');
  },

  // ── settings & alerts
  tg: (x) => {
    S.toggles[x] = !S.toggles[x];
    render();
  },
  logout: () => {
    S.stack = [{ n: 'signup' }];
    render();
  },
  alt: (x) => {
    S.alt = x;
    render();
  },
  usealt: (x) => {
    const al = ALERTS.find((q) => q.id == x),
      i = S.plan.findIndex((p) => p.id == al.act);
    if (!S.alt) return toast('No alternative selected');
    if (i > -1) {
      S.plan.splice(i, 1);
      addToPlan(S.alt);
    }
    toTab('schedule', 'Switched to ' + A[S.alt].title + ' · group notified');
  },
};

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-a],[data-go]')) return;
  const t = e.target.closest('[data-tab],[data-go],[data-a]');
  if (!t) return;
  if ($('#pt')) S.draft = $('#pt').value;
  if (t.dataset.tab) return toTab(t.dataset.tab);
  if (t.dataset.go) {
    e.preventDefault();
    return go(t.dataset.go);
  }
  const raw = t.dataset.a;
  if (raw.startsWith('toast:')) return toast(raw.slice(6));
  const [a, x, y] = raw.split(':');
  if (ACTIONS[a]) ACTIONS[a](x, y, e);
});

// ช่องพิมพ์: อัปเดต state โดยไม่วาดทั้งหน้าใหม่ (เคอร์เซอร์จะได้ไม่หลุด)
const fmtCardNum = (v) => v.replace(/\D/g, '').slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 ');
const fmtExp = (v) => {
  const d = v.replace(/\D/g, '').slice(0, 4);
  return d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d;
};
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id == 'dq') {
    S.q = t.value;
    $('#dl').innerHTML = discoverList();
  } else if (t.id == 'ps') {
    S.ps = t.value;
    $('#pl').innerHTML = attachList();
  } else if (t.id == 'cq') {
    S.cq = t.value;
    $('#cl').innerHTML = communityList();
  } else if (t.id == 'promo') S.pay.promo = t.value;
  else if (t.id == 'cnum') S.pay.card.num = t.value = fmtCardNum(t.value);
  else if (t.id == 'cexp') S.pay.card.exp = t.value = fmtExp(t.value);
  else if (t.id == 'ccvc') S.pay.card.cvc = t.value = t.value.replace(/\D/g, '').slice(0, 4);
  else if (t.id == 'cname') S.pay.card.name = t.value;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'cm') {
    const b = document.querySelector('[data-a^="send:"]');
    if (b) b.click();
  }
  if (e.key === 'Enter' && e.target.id === 'promo') ACTIONS.promo();
});

// นับถอยหลังอายุ QR PromptPay
setInterval(() => {
  const el = $('#qrt');
  if (!el) return;
  const left = Math.max(0, 900 - Math.floor((Date.now() - S.qrStart) / 1000));
  el.textContent = Math.floor(left / 60) + ':' + pad2(left % 60);
}, 1000);

S.stack = [{ n: 'signup' }];
render();
</script></body></html>
